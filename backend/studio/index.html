                    <!-- META-info nederst -->
                    <div class="detail-meta">
                        Trade ID: <code>${trade.trade_id}</code><br>
                        Konto: ${trade.account_id} · Instans: ${trade.instance_id} · IBKR: ${trade.ibkr_account}
                        ${trade.variant ? ` · Variant: ${trade.variant}` : ""}
                    </div>
                </div>
            `;
        }

        // ─── Notes-redigering ─────────────────────────────────
        function enterNotesEdit(tradeId) {
            document.getElementById("notes-display").style.display = "none";
            document.getElementById("notes-edit-btn").style.display = "none";
            document.getElementById("notes-edit").style.display = "block";
            const textarea = document.getElementById("notes-textarea");
            textarea.focus();
            // Placer cursor i slutningen af eksisterende tekst
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        }

        function cancelNotesEdit() {
            document.getElementById("notes-edit").style.display = "none";
            document.getElementById("notes-display").style.display = "block";
            document.getElementById("notes-edit-btn").style.display = "inline-block";
            document.getElementById("notes-edit-error").textContent = "";
        }

        async function saveNotes(tradeId) {
            const textarea = document.getElementById("notes-textarea");
            const errorDiv = document.getElementById("notes-edit-error");
            const saveBtn = document.querySelector(".notes-save-btn");

            const newNotes = textarea.value.trim();

            // UI feedback under save
            saveBtn.disabled = true;
            saveBtn.textContent = "Gemmer...";
            errorDiv.textContent = "";

            try {
                const res = await authFetch(`/journal/trades/${tradeId}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ notes: newNotes }),
                });

                if (!res.ok) {
                    // Backendens detail baerer den brugbare besked — fx at den
                    // maskine der EJER handlen er slukket. "HTTP 503" alene ville
                    // efterlade brugeren i tvivl om noten er gemt eller ej.
                    let grund = `HTTP ${res.status}`;
                    try {
                        const j = await res.json();
                        if (j && j.detail) grund = j.detail;
                    } catch (_) {}
                    throw new Error(grund);
                }
                const svar = await res.json().catch(() => ({}));

                // Success: opdater display med ny tekst og gå tilbage til view-mode
                const displayDiv = document.getElementById("notes-display");
                if (newNotes) {
                    displayDiv.innerHTML = newNotes
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;");
                } else {
                    displayDiv.innerHTML = "<span class='muted-text'>Ingen notes endnu — klik Rediger for at tilføje</span>";
                }

                // Skift tilbage til view-mode
                document.getElementById("notes-edit").style.display = "none";
                document.getElementById("notes-display").style.display = "block";
                document.getElementById("notes-edit-btn").style.display = "inline-block";

            overlay.innerHTML = `
                <div style="background:#1a1a1a; border:1px solid #444; border-radius:8px;
                            width:min(900px, 90vw); max-height:90vh; display:flex;
                            flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
                    <div style="display:flex; align-items:center; justify-content:space-between;
                                padding:14px 20px; border-bottom:1px solid #333; flex-shrink:0;">
                        <div style="font-size:16px; font-weight:700; color:#4a9eff;">${title}</div>
                        <button onclick="closeStrategyDocs()"
                                style="background:transparent; border:1px solid #444; color:#aaa;
                                       border-radius:4px; padding:4px 10px; cursor:pointer; font-size:13px;"
                                title="Luk (ESC)">✕ Luk</button>
                    </div>
                    <div id="docs-body" style="flex:1; overflow:auto; padding:20px 28px;
                                                font-size:14px; line-height:1.6; color:#e0e0e0;">
                        <div style="text-align:center; padding:40px; color:#888; font-style:italic;">
                            Indlæser dokumentation...
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            // ESC for at lukke
            document.addEventListener("keydown", handleDocsKeydown);

            // Hent indhold
            try {
                const res = await authFetch(`/strategies/${strategy}/docs/${version}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const html = (window.marked && marked.parse)
                    ? marked.parse(data.content || "")
                    : (data.content || "");   // fallback: raa tekst hvis marked mangler

                    `<div class="markdown-body">${html}</div>`;
            } catch (e) {
                document.getElementById("docs-body").innerHTML = `
                    <div style="padding:12px 16px; background:rgba(248,113,113,0.1);
                                border:1px solid #f87171; border-radius:4px; color:#f87171;">
                        ⚠ Kunne ikke hente dokumentation: ${e.message}

        function closeStrategyDocs() {
            const overlay = document.getElementById("docs-overlay");
            if (overlay) overlay.remove();

        // ─────────────────────────────────────────────────────
        // ANALYSE-SIDE
        // ─────────────────────────────────────────────────────
        let analysisPeriod = "all";

        // ─────────────────────────────────────────────────────
        // Analyse — multi-maskine overblik
        // ─────────────────────────────────────────────────────
        let analysisPeers = null;  // cache peers efter første hent

        async function showAnalysis() {
            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                        <h2 style="margin:0; font-size:18px;">Status — alle maskiner</h2>
                        <button id="analysis-refresh" style="background:#1a4a8a; border:1px solid #4a9eff; color:#fff; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:13px;">
                            ↻ Opdater
                        </button>
                    </div>
                    <div id="analysis-body">

                    </div>

            `;

            document.getElementById("analysis-refresh").addEventListener("click", loadAnalysisData);

        async function loadAnalysisData() {
            const body = document.getElementById("analysis-body");
            if (!body) return;

            // Hent peers-listen (lokalt — kender ikke andre maskiner endnu)
            if (!analysisPeers) {
                try {
                    const res = await fetch("/peers");
                    const data = await res.json();
                    analysisPeers = (data.peers || []).filter(p => p.enabled);
                } catch (e) {
                    body.innerHTML = `<div class="error">Kunne ikke hente peers: ${e.message}</div>`;
                    return;
                }
            }

            if (analysisPeers.length === 0) {
                body.innerHTML = `<div class="empty">Ingen aktive maskiner i peers.json</div>`;
                return;
            }

            // Vis loading-tilstand med peers-navne
            body.innerHTML = `
                <div class="empty">
                    Kontakter ${analysisPeers.length} maskiner...<br>
                    <span style="font-size:11px; color:#666;">${analysisPeers.map(p => p.name).join(" · ")}</span>
                </div>
            `;

            // Tailscale-status (pålidelig 'tændt') fra algoserveren + /health pr.
            // maskine, parallelt. Tailscale ved om maskinen er på netværket selvom
            // dens trading-backend ikke kører.
            const [tsRes, results] = await Promise.all([
                fetch("/fleet/network").then(r => r.json()).catch(() => ({ ok: false, machines: {} })),
                Promise.all(analysisPeers.map(p => fetchPeerData(p))),
            ]);
            const tsMap = (tsRes && tsRes.ok) ? (tsRes.machines || {}) : {};

            renderAnalysisTable(results, tsMap);
        }

        async function fetchPeerData(peer) {
            const result = {
                peer: peer,
                backendUp: false,   // kører trading-backenden (uvicorn)?
                health: null,
                error: null,
            };

            // Poll /health → svarer trading-backenden? ('Tændt'-status kommer fra
            // Tailscale, ikke herfra — fetch kan ikke skelne backend-nede fra slukket.)
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                const res = await fetch(`${peer.url}/health`, { signal: controller.signal });
                clearTimeout(timeoutId);

                result.backendUp = true;   // den svarede overhovedet → backend kører
                if (res.ok) {
                    result.health = await res.json();
                } else {
                    result.error = `HTTP ${res.status}`;
                }
            } catch (e) {
                result.error = e.name === "AbortError" ? "Timeout" : "Ingen forbindelse";
            }
            return result;
        }

        function renderAnalysisTable(results, tsMap = {}) {
            const body = document.getElementById("analysis-body");

            // Pænt sidst-set-tidspunkt (kun hvis gyldigt)
            const fmtLastSeen = (iso) => {
                if (!iso) return "";
                const d = new Date(iso);
                if (isNaN(d) || d.getFullYear() < 2000) return "";
                return d.toLocaleString("da-DK", { day: "2-digit", month: "2-digit",
                                                   hour: "2-digit", minute: "2-digit" });
            };

            const rows = results.map(r => {
                const machineCell = `<td><strong>${r.peer.name}</strong><br><span style="font-size:11px; color:#666;">${r.peer.host || "—"}</span></td>`;

                const ts = tsMap[(r.peer.host || "").toLowerCase()] || null;

                // Status = er maskinen tændt? Pålideligt fra Tailscale (på tailnet),
                // eller hvis backenden svarer (så er den åbenlyst tændt).
                const isOn = r.backendUp || (ts ? ts.online : false);
                const statusCell = isOn
                    ? `<span class="status-dot online"></span> Tændt`
                    : `<span class="status-dot offline"></span> Ikke tændt`;

                // Tailscale = er maskinen logget på tailnet?
                let tsCell;
                if (!ts) {
                    tsCell = `<span class="muted">Ukendt</span>`;
                } else if (ts.online) {
                    tsCell = `<span class="status-dot online"></span> Online`;
                } else {
                    const seen = fmtLastSeen(ts.last_seen);
                    tsCell = `<span class="status-dot offline"></span> Offline`
                           + (seen ? `<br><span style="font-size:11px; color:#777;">sidst set ${seen}</span>` : "");
                }

                // Backend = kører trading-backenden (uvicorn)?
                const backendCell = r.backendUp
                    ? `<span class="status-dot online"></span> Kører`
                    : (isOn ? `<span class="status-dot warn"></span> Nede`
                            : `<span class="muted">—</span>`);

                // Uden /health-svar kender vi ikke drifts-forudsætningerne
                if (!r.health) {
                    return `
                        <tr>
                            ${machineCell}
                            <td>${statusCell}</td>
                            <td>${tsCell}</td>
                            <td>${backendCell}</td>
                            <td colspan="6" class="muted">—</td>
                        </tr>
                    `;
                }

                const h = r.health;
                const ibkr = h.ibkr_connected
                    ? `<span style="color:#4ade80;">✓ Forbundet</span>`
                    : `<span class="status-dot warn"></span> Afbrudt`;
                // Scheduleret auto-strategi/-er — kun algoserveren auto-starter; workstation
                // kører manuelt. auto_starts (liste) viser ALLE (K2 + Europa); falder tilbage
                // til den gamle enkelt-scheduled hvis peeren kører aeldre kode.
                const scheduled = (Array.isArray(h.auto_starts) && h.auto_starts.length)
                    ? h.auto_starts.map(a => `${a.strategy} <span class="muted">${a.et_time} ET</span>`).join("<br>")
                    : (h.scheduled
                        ? `${h.scheduled.strategy} · ${h.scheduled.et_time} ET${h.scheduled.dk_time ? ` <span class="muted">/ ${h.scheduled.dk_time} DK</span>` : ""}`
                        : `<span class="muted">Manuel</span>`);

                // Kører nu — per-strategi (fra h.strategies, samme form som /algo/list).
                // Peer paa aeldre kode (intet strategies-felt) -> "—". Skrinlagte filtreres.
                let koerernu;
                if (Array.isArray(h.strategies)) {
                    const running = h.strategies.filter(s => s.running && !SKRINLAGTE_STRATEGIER.has(s.name));
                    if (running.length === 0) {
                        koerernu = `<span class="muted">ingen</span>`;
                    } else {
                        koerernu = running.map(s => {
                            const st = s.stats || {};
                            const tip = `${st.trades_today ?? 0} handler · P&L ${fmtMoneySigned(st.pnl_today)} · ${st.open_positions ?? 0} aabne`;
                            return `<span style="color:#4ade80;" title="${tip}">● ${s.name}</span>`;
                        }).join("<br>");
                    }
                } else {
                    koerernu = `<span class="muted">—</span>`;
                }
                const nextRun   = (h.scheduled && h.next_start)
                    ? `${h.next_start}${h.next_start_dk ? ` <span class="muted">/ ${h.next_start_dk.split(" ").slice(-1)[0]} DK</span>` : ""}`
                    : "—";
                const tradingDay = (h.is_trading_day == null) ? "—"
                                 : (h.is_trading_day ? "Ja" : `<span class="muted">Nej</span>`);
                const konto = (h.paper_trading == null) ? "—"
                            : (h.paper_trading ? "Paper" : `<span style="color:#ffb84a;">Live</span>`);

                return `
                    <tr>
                        ${machineCell}
                        <td>${statusCell}</td>
                        <td>${tsCell}</td>
                        <td>${backendCell}</td>
                        <td>${ibkr}</td>
                        <td>${scheduled}</td>
                        <td style="font-size:12px;">${koerernu}</td>
                        <td style="font-size:12px; color:#cfcfcf;">${nextRun}</td>
                        <td>${tradingDay}</td>
                        <td>${konto}</td>
                    </tr>
                `;
            }).join("");

            body.innerHTML = `
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="border-bottom:1px solid #333; text-align:left;">
                            <th style="padding:10px 8px;">Maskine</th>
                            <th style="padding:10px 8px;">Status</th>
                            <th style="padding:10px 8px;">Tailscale</th>
                            <th style="padding:10px 8px;">Backend</th>
                            <th style="padding:10px 8px;">IBKR</th>
                            <th style="padding:10px 8px;">Scheduleret</th>
                            <th style="padding:10px 8px;">Kører nu</th>
                            <th style="padding:10px 8px;">Næste kørsel</th>
                            <th style="padding:10px 8px;">Handelsdag</th>
                            <th style="padding:10px 8px;">Konto</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>
            `;
        }

        async function loadAnalysis() {
            try {
                const res = await authFetch(`/analysis/summary?period=${analysisPeriod}`);
                const data = await res.json();
                if (data.error) {
                    renderAnalysisError(data.error);
                    return;
                }
                renderAnalysis(data);
            } catch (e) {
                renderAnalysisError("Backend ikke tilgængelig: " + e.message);
            }
        }

        function renderAnalysisError(msg) {

        let logReconnectTimer = null;

        function stopLogStream() {
            if (logReconnectTimer) { clearTimeout(logReconnectTimer); logReconnectTimer = null; }
            if (logSocket) {
                // Fjern handlers så onclose ikke trigger reconnect
                logSocket.onclose = null;

        function setLogMode(mode) {
            logMode = mode;
            logEntries = [];
            const liveTab = document.getElementById("log-tab-live");
            const histTab = document.getElementById("log-tab-hist");
            const histControls = document.getElementById("log-hist-controls");

                renderLogStream();
                connectLogStream();   // start live-stream
            } else {
                liveTab.className = "btn-secondary";
                histTab.className = "btn-primary";
                histControls.style.display = "flex";
                connEl.style.display = "none";

                document.getElementById("log-stream").innerHTML =
                    `<div class="empty">Vælg tidsvindue og klik Hent</div>`;

        async function loadLogHistory() {
            // Fra-/til-dato læses fra de danske tekstfelter (dd-mm-åååå); falder
            // tilbage til det skjulte date-input hvis tekstfeltet er tomt/ugyldigt.
            const date    = parseDk(document.getElementById("log-date-txt").value)
                         || document.getElementById("log-date").value;
            const dateTo  = parseDk(document.getElementById("log-date-to-txt").value)
                         || document.getElementById("log-date-to").value
                         || date;
            // Normalisér fra/til til HH:MM og skriv den pæne form tilbage i feltet.
            const fromEl = document.getElementById("log-from");
            const toEl   = document.getElementById("log-to");
            const from   = normHHMM(fromEl.value) || "00:00";
            const to     = normHHMM(toEl.value)   || "23:59";
            fromEl.value = from;
            toEl.value   = to;
            const source = document.getElementById("log-source").value;
            const stream = document.getElementById("log-stream");

            stream.innerHTML = `<div class="empty">Henter events...</div>`;

            const HIST_LIMIT = 5000;   // rigeligt til et flerdags-vindue
            const params = new URLSearchParams();
            params.set("tz", "dk");   // fortolk datoer + fra/til i dansk tid
            if (date)   params.set("date", date);
            if (dateTo) params.set("date_to", dateTo);
            if (from) params.set("from_time", from);
            if (to)   params.set("to_time", to);
            if (source) params.set("source", source);
            params.set("limit", HIST_LIMIT);

            try {
                const res = await authFetch(`/journal/events?${params.toString()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                logTruncated = (data.count || 0) >= HIST_LIMIT;
                logEntries = (data.events || []).map(ev => {
                    // Tidsstempel i dansk lokaltid (fra UTC-anker); fallback til ts_local.
                    const t = _dkClockFromUtc(ev.ts_utc)
                            || (ev.ts_local ? ev.ts_local.substring(11, 19) : "");
                    const lvl = ev.payload?.level
                              || (ev.event_type === "strategy_stopped" ? "info" : "info");
                    const sym = ev.symbol ? ` ${ev.symbol}` : "";
                    const msg = ev.payload?.message
                              || `${ev.event_type}${sym}`;
                    return {
                        time: t,
                        text: `[${ev.source}] ${msg}`,
                        level: lvl,
                    };
                });
                if (logEntries.length === 0) {
                    stream.innerHTML = `<div class="empty">Ingen events i dette vindue</div>`;
                } else {
                    renderLogStream();
                    if (logTruncated) {
                        const note = document.createElement("div");
                        note.style.cssText = "color:#fdba74; padding:4px 0; font-weight:600;";
                        note.textContent = `⚠ Visning begrænset til ${HIST_LIMIT} events — indsnævr perioden for at se resten.`;
                        stream.insertBefore(note, stream.firstChild);
                    }
                }
            } catch (e) {
                stream.innerHTML = `<div class="error">Kunne ikke hente: ${e.message}</div>`;
            }
        }

        function connectLogStream() {
            stopLogStream();  // sikkerhed: luk evt. gammel

            // Byg ws:// (eller wss://) URL ud fra den side der serverede Studio,
            // så den altid peger på DENNE backends /ws/algo.
            const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${proto}//${window.location.host}/ws/algo`;

            try {
                logSocket = new WebSocket(wsUrl);
            } catch (e) {
                setLogConn(false, "Kunne ikke forbinde");
                scheduleLogReconnect();
                return;
            }

            logSocket.onopen = () => setLogConn(true, "Forbundet");

            logSocket.onmessage = (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch (e) { return; }
                handleLogMessage(msg);
            };

            logSocket.onclose = () => {
                setLogConn(false, "Afbrudt — genforbinder...");
                scheduleLogReconnect();
            };

            logSocket.onerror = () => {
                setLogConn(false, "Forbindelsesfejl");
                // onclose følger typisk efter og håndterer reconnect
            };
        }

        function scheduleLogReconnect() {
            // Genforbind kun hvis vi stadig er på Log-fanen OG i live-tilstand
            if (currentPage !== "log" || logMode !== "live") return;
            if (logReconnectTimer) return;
            logReconnectTimer = setTimeout(() => {
                logReconnectTimer = null;
                if (currentPage === "log") connectLogStream();
            }, 3000);
        }

        function setLogConn(online, text) {
            const el = document.getElementById("log-conn");
            if (!el) return;
            el.innerHTML = `<span class="status-dot ${online ? "online" : "offline"}"></span> ${text}`;
        }

        function handleLogMessage(msg) {
            const type = msg.type;
            let time, text, level = "info";

            if (type === "strategy_log") {
                time  = msg.timestamp || "";
                text  = `[${msg.strategy || "?"}] ${msg.message || ""}`;
                level = msg.level || "info";
            } else if (type === "algo_status") {
                time  = msg.time || "";
                const strat = msg.strategy ? `[${msg.strategy}] ` : "";
                text  = `${strat}${msg.message || ""}`;
                // Udled niveau fra status så fejl bliver røde
                level = msg.status === "error" ? "error"
                      : msg.status === "done"  ? "success"
                      : "info";
            } else if (type === "algo_trade") {
                time  = msg.time || "";
                const verb = { buy: "KØB", sell: "SÆLG", sell_short: "SHORT", buy_cover: "COVER" }[msg.action] || msg.action;
                const px   = msg.price != null ? `$${msg.price}` : (msg.exit_price != null ? `$${msg.exit_price}` : "");
                text  = `${verb} ${msg.shares || ""} ${msg.ticker || ""} ${px}`.trim();
                level = (msg.action === "buy" || msg.action === "sell_short") ? "trade" : "success";
            } else {
                return;  // ukendt type — ignorér
            }

            logEntries.push({ time, text, level });
            if (logEntries.length > LOG_MAX_ENTRIES) {
                logEntries = logEntries.slice(-LOG_MAX_ENTRIES);
            }
            renderLogStream();
        }

        function renderLogStream() {
            const container = document.getElementById("log-stream");
            if (!container) return;

            if (logEntries.length === 0) {
                container.innerHTML = `<div class="empty">Venter på beskeder...</div>`;
                return;
            }

            const colorFor = (level) => ({
                error:   "#ff8a8a",
                warning: "#fdba74",
                success: "#5ee99a",
                trade:   "#7ec0ff",
                info:    "#d0d0d0",
            }[level] || "#d0d0d0");

            // Tjek om brugeren er scrollet til bunden FØR vi tilføjer
            const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 40;

            container.innerHTML = logEntries.map(e => {
                const safeText = e.text
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<div style="white-space:pre; margin:0; padding:0;" title="${safeText}">` +
                    `<span style="color:#666;">${e.time}</span> ` +
                    `<span style="color:${colorFor(e.level)};">${safeText}</span>` +
                    `</div>`;
            }).join("");

            // Auto-scroll til bunden hvis brugeren allerede var der
            if (atBottom) container.scrollTop = container.scrollHeight;
        }

        function clearLogView() {
            logEntries = [];
            logTruncated = false;
            renderLogStream();
        }

        // Kort visuel kvittering på en knap (fx efter kopiering).
        function flashBtn(btn, msg) {
            if (!btn) return;
            const orig = btn.dataset.orig || btn.textContent;
            btn.dataset.orig = orig;
            btn.textContent = msg;
            btn.disabled = true;
            setTimeout(() => {
                btn.textContent = btn.dataset.orig;
                btn.disabled = false;
            }, 1600);
        }

        // Kopiér hele den viste log (tid + tekst pr. linje) til clipboard som ren
        // tekst, så den kan indsættes i fx Word og bladres igennem. CRLF-linjeskift
        // så Word får korrekte afsnit. Falder tilbage til execCommand i ældre webview.
        async function copyLogToClipboard(btn) {
            if (!logEntries.length) { flashBtn(btn, "Intet at kopiere"); return; }
            const header = `Trading Dash — Log (${logEntries.length} linjer)`;
            const body = logEntries.map(e => `${e.time}\t${e.text}`).join("\r\n");
            const text = `${header}\r\n${"=".repeat(header.length)}\r\n${body}\r\n`;
            const ok = await copyTextToClipboard(text);
            flashBtn(btn, ok ? `✓ Kopieret (${logEntries.length} linjer)` : "Kopiering fejlede");
        }

        async function copyTextToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) { /* fald igennem til execCommand */ }
            try {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand("copy");
                document.body.removeChild(ta);
                return ok;
            } catch (e) { return false; }
        }

        // ─────────────────────────────────────────────────────
        // STATUS-SIDE — algoserverens helbred i ét blik
        // ─────────────────────────────────────────────────────
        let statusTimer = null;

        async function showStatus() {
            await loadStatusData();
            // Ligger nu under Analyse-fanen (page-id "analysis") efter ombytningen.
            statusTimer = setInterval(() => {
                if (currentPage === "analysis") loadStatusData();

        async function loadStatusData() {
            try {
                const res = await fetch("/status");
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                // Per-strategi-status (samme kilde som Strategier-fanen). Valgfri: fejler den
                // (auth/ikke-algoserver), falder Status-fanen tilbage til /status' globale bool.
                let algoList = null;
                try {
                    const ar = await authFetch("/algo/list");
                    if (ar.ok) algoList = await ar.json();
                } catch (e) { /* valgfri — vis /status alene */ }
                renderStatus(data, algoList);
            } catch (e) {
                document.getElementById("content").innerHTML = `
                    <div class="card"><div class="error"><strong>Fejl:</strong> ${e.message}</div></div>`;
            }
        }

        function renderStatus(d, algoList) {
            // Helper: grøn/rød indikator-prik med tekst
            const dot = (ok, okText, badText) =>
                `<span class="status-dot ${ok ? "online" : "offline"}"></span>${ok ? okText : badText}`;

            // Per-strategi (fra /algo/list). Null -> fald tilbage til /status' globale algo.running.
            const stratList = (algoList && algoList.strategies)
                ? algoList.strategies.filter(s => !SKRINLAGTE_STRATEGIER.has(s.name))
                : null;
            const runningCount = stratList ? stratList.filter(s => s.running).length : null;

            const id = d.identity || {};
            const sched = d.scheduler || {};
            const wd = d.tws_watchdog || {};
            const algo = d.algo || {};
            const risk = d.risk || {};
            const backend = d.backend || {};

            // TWS online = den PÅLIDELIGE kilde (watchdog prober aktivt port 7497).
            // ibkr.connected er en global variabel sat ved opstart — kan være stale.
            const twsOnline = wd.tws_online === true;
            const schedRunning = sched.running === true;
            const algoRunning = algo.running === true;

            // Jobs-tabel
            // Status (i dag): samme logik som koerer_nu.py. last_run_on er in-memory pr.
            // backend-proces og saettes foerst naar vinduet rammer -> "—" foer vinduet er
            // IKKE "kører aldrig". Kørte i dag (grøn) / Afventer i dag (vindue ikke naaet) /
            // IKKE kørt i dag! (vindue passeret uden kørsel = problem).
            const etDate = (sched.now_et || "").slice(0, 10);
            const nowHm  = (sched.now_et || "").slice(11, 16);
            const jobsRows = (sched.jobs || []).map(j => {
                const last = j.last_run_on;
                const windowPassed = j.et_time && nowHm && nowHm >= j.et_time;
                let state, color;
                if (last === etDate)       { state = "Kørte i dag";      color = "#4ade80"; }
                else if (!windowPassed)    { state = "Afventer i dag";   color = "#888"; }
                else                       { state = "IKKE kørt i dag!"; color = "#ffb84a"; }
                const lastTxt = (last && last !== etDate) ? ` <span style="color:#777; font-size:11px;">· sidst ${last}</span>` : "";
                return `
                    <tr>
                        <td>${j.name}</td>
                        <td class="num">${j.et_time} ET</td>
                        <td style="color:${color}; font-weight:600;">${state}${lastTxt}</td>
                    </tr>`;
            }).join("");

            const stats = algo.stats || {};

            document.getElementById("content").innerHTML = `
                <div class="section-title">Algoserver status
                    <span style="margin-left:12px; font-size:13px; font-weight:500; color:#888;">
                        ${d.time ? "opdateret " + new Date(d.time).toLocaleTimeString("da-DK") : ""}
                    </span>
                </div>

                <!-- KRITISKE INDIKATORER -->
                <div class="card">
                    <div class="stats-grid">
                        <div>
                            <div class="stat-label">TWS (port 7497)</div>
                            <div style="font-size:18px; font-weight:600; margin-top:6px;">
                                ${dot(twsOnline, "Online — Iben logget ind", "Offline — afventer login")}
                            </div>
                            ${!twsOnline && wd.fails ? `<div class="muted-text" style="margin-top:4px;">${wd.fails} mislykkede probes</div>` : ""}
                        </div>
                        <div>
                            <div class="stat-label">Scheduler</div>
                            <div style="font-size:18px; font-weight:600; margin-top:6px;">
                                ${dot(schedRunning, "Kører", "Stoppet")}
                            </div>
                            <div class="muted-text" style="margin-top:4px;">Næste ORB-start: ${sched.next_start ? `${sched.next_start}${sched.next_start_dk ? ` / ${sched.next_start_dk.split(" ").slice(-1)[0]} DK` : ""}` : "—"}</div>
                        </div>
                        <div>
                            <div class="stat-label">Strategier</div>
                            <div style="font-size:18px; font-weight:600; margin-top:6px;">
                                ${stratList
                                    ? `<span class="status-dot ${runningCount > 0 ? "online" : "offline"}"></span>${runningCount} af ${stratList.length} kører`
                                    : dot(algoRunning, "Kører", "Ikke aktiv (" + (stats.status || "idle") + ")")}
                            </div>
                            <div class="muted-text" style="margin-top:4px;">${stratList ? "se Strategier — kører nu" : "Handler i dag: " + (stats.trades_today ?? 0)}</div>
                        </div>
                    </div>
                </div>

                ${stratList ? `
                <!-- STRATEGIER — KOERER NU (per-strategi, fra /algo/list) -->
                <div class="section-title">Strategier — kører nu</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead><tr><th>Strategi</th><th>Status</th><th style="text-align:right;">Handler</th><th style="text-align:right;">Dagens P&L</th><th style="text-align:right;">Åbne</th></tr></thead>
                        <tbody>${stratList.map(s => {
                            const run = s.running; const st = s.stats || {};
                            return `<tr>
                                <td><span class="status-dot ${run ? "online" : "offline"}"></span>${s.name}</td>
                                <td>${run ? "Kører" : (s.status || "stoppet")}</td>
                                <td class="num">${run ? (st.trades_today ?? 0) : "—"}</td>
                                <td class="num ${run ? cls(st.pnl_today) : ""}">${run ? fmtMoneySigned(st.pnl_today) : "—"}</td>
                                <td class="num">${run ? (st.open_positions ?? 0) : "—"}</td>
                            </tr>`;
                        }).join("")}</tbody>
                    </table>
                </div>` : ""}

                <!-- IDENTITET -->
                <div class="section-title">Identitet</div>
                <div class="card">
                    <div class="detail-grid">
                        <div class="detail-row"><div class="detail-label">Konto</div><div class="detail-value">${id.account || "—"}</div></div>
                        <div class="detail-row"><div class="detail-label">Instans</div><div class="detail-value">${id.instance || "—"}</div></div>
                        <div class="detail-row"><div class="detail-label">Rolle</div><div class="detail-value">${id.role || "—"}</div></div>
                        <div class="detail-row"><div class="detail-label">IBKR-konto</div><div class="detail-value">${id.ibkr || "—"}</div></div>
                        <div class="detail-row"><div class="detail-label">Type</div><div class="detail-value">${id.paper ? "Paper" : "LIVE"}</div></div>
                        <div class="detail-row"><div class="detail-label">ET-tid nu</div><div class="detail-value">${sched.now_et || "—"}</div></div>
                    </div>
                </div>

                <!-- SCHEDULER JOBS -->
                <div class="section-title">Planlagte jobs (${(sched.jobs || []).length})</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead><tr><th>Job</th><th style="text-align:right;">Tidspunkt</th><th>Status (i dag)</th></tr></thead>
                        <tbody>${jobsRows || `<tr><td colspan="3" class="empty">Ingen jobs</td></tr>`}</tbody>
                    </table>
                </div>

                <!-- RISK -->
                <div class="section-title">Risiko & kapital</div>
                <div class="card">
                    <div class="detail-grid">
                        <div class="detail-row"><div class="detail-label">Dagens P&L</div><div class="detail-value ${cls(risk.total_pnl_today)}">${fmtMoneySigned(risk.total_pnl_today)}</div></div>
                        <div class="detail-row"><div class="detail-label">Daglig tab-grænse</div><div class="detail-value">${fmtMoney(risk.daily_loss_limit)}</div></div>
                        <div class="detail-row"><div class="detail-label">Tab-grænse nået?</div><div class="detail-value">${risk.daily_limit_hit ? "JA ⚠" : "Nej"}</div></div>
                        <div class="detail-row"><div class="detail-label">Nødstop aktivt?</div><div class="detail-value">${risk.emergency_active ? "JA ⚠" : "Nej"}</div></div>
                        <div class="detail-row"><div class="detail-label">Eksponering</div><div class="detail-value">${fmtMoney(risk.total_exposure)} / ${fmtMoney(risk.max_total_exposure)}</div></div>
                        <div class="detail-row"><div class="detail-label">Backend journal-events</div><div class="detail-value">${backend.journal_events ?? "—"}</div></div>
                    </div>
                </div>

                <div class="controls">
                    <span>Auto-opdaterer hver 5s</span>
                    <button onclick="loadStatusData()">↻ Opdater nu</button>
                </div>
            `;
        }

        // ─────────────────────────────────────────────────────
        // Start — tjek auth først
        // ─────────────────────────────────────────────────────
        checkAuthAndStart();
    </script>
<script>
// ⚠ ADRESSEN HENTES FRA BACKENDEN, ikke hardkodet. Oevebanen kan flytte til
// algoserveren, og en kopi af URL'en her ville betyde to steder at rette.
// Studio serveres af den samme backend der kender PRACTICE_URL.
(async () => {
  const a = document.getElementById("oevebane-link");
  if (!a) return;
  try {
    const s = await (await fetch("/practice/status")).json();
    a.href = s.url;
    a.title = s.lokal
      ? "Åbn Trading Practice på DIN maskine (" + s.url + "). Den skal køre lokalt."
      : "Åbn Trading Practice (" + s.url + ")";
  } catch (e) {
    // ⚠ Svarer backenden ikke, saettes ingen adresse — en knap der foerer til
    // "#" er aabenlyst i stykker, mens en forkert adresse ser rigtig ud.
    a.title = "Kunne ikke hente Trading Practice-adressen fra backenden";
  }
})();
</script>
</body>

</html>
