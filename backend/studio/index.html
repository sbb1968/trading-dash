        // (POSITION_SIZE). Ved nuvaerende niveauer MES ≈ ×37, M2K ≈ ×15. UDEN pris
        // (aggregat-tabeller): fald tilbage til kontrakt-multiplikatoren ($N/pt).
        // Tomt for aktier (mult === 1).
        function multBadge(symbol, price) {
            const mult = FUTURES_MULT[(symbol || "").toUpperCase()] || 1;
            if (mult === 1) return "";
            const badgeStyle = `style="font-size:10px;font-weight:700;color:#fde047;`
                 + `background:rgba(250,204,21,0.12);border:1px solid rgba(250,204,21,0.4);`
                 + `border-radius:3px;padding:1px 5px;margin-left:6px;"`;
            if (price != null && price > 0) {
                const lev    = (price * mult) / POSITION_SIZE;
                const levTxt = "×" + (lev >= 10 ? Math.round(lev) : lev.toFixed(1));
                return `<span title="Gearing: hver kontrakt styrer pris × $${mult} i notionel `
                     + `eksponering — ${levTxt} gange display-budgettet ($${POSITION_SIZE}). `
                     + `Futures er staerkt gearede." ${badgeStyle}>${levTxt}</span>`;
            }
            // Ingen pris: behold kontrakt-multiplikator-maerket.
            return `<span title="Futures-kontrakt: $${mult} pr. indekspoint `
                 + `(kontrakt-multiplikator)." ${badgeStyle}>$${mult}/pt</span>`;
        }
        // Header-urealiseret = SUM af linjernes urealiseret (det forventede).
        // Falder tilbage til IBKR's konto-aggregat hvis ingen linje kunne beregnes.
        function sumUnrealized(views, snap) {
            // Ingen aabne (algo-)positioner -> urealiseret er 0. Fald IKKE tilbage til
            // IBKR's konto-aggregat her, da det ogsaa daekker positioner algoerne ikke
            // styrer (fx en manuel short) -> ville vise et grroent tal ved 0 positioner.
            if (!views || views.length === 0) return 0;
            const c = views.filter(v => v.unrPnl != null);
            if (c.length > 0) return c.reduce((a, v) => a + v.unrPnl, 0);
            // Positioner FINDES men kunne ikke prises -> brug IBKR-aggregatet.
            if (snap && snap.ok && snap.unrealized_pnl != null) return snap.unrealized_pnl;
            return null;
        }
        function sortOpenPositions(positions) {
            return [...(positions || [])].sort((a, b) =>
                (b.entry_time_et || "").localeCompare(a.entry_time_et || ""));
        }
        // Synlig status-stribe der forklarer HVORFOR pris/urealiseret evt.
        // mangler — eller "" hvis alt er fint. Bruges af baade desktop og mobil.
        function buildPriceStatusBanner(snap, openViews) {
            const box = (color, text) =>
                `<div class="card" style="padding:8px 12px; border-left:3px solid ${color}; font-size:13px; color:${color};">${text}</div>`;
            if (!snap || !snap.ok) {
                const why = (snap && snap.error) ? snap.error : "IBKR ikke forbundet";
                return box("#f59e0b",
                    `⚠ Live konto-data utilgængelig — ${why}. Aktuel pris og urealiseret P&L kan ikke vises (tjek at TWS er logget ind og at backenden kører).`);
            }
            // ⚠ INGEN GÆTTEDE ÅRSAGER. Der stod før "markedet er sandsynligvis
            // lukket" — men intet i denne funktion måler markedstid. Den så kun
            // at prisen manglede og fandt på en forklaring.
            //
            // Målt 13-08: 5 af 8 positioner manglede pris mens markedet var
            // åbent for tre af dem. Mønstret fulgte STRATEGIEN, ikke uret:
            // Konfluens 2 havde pris, BuyTheDip og RelStyrke havde ikke. REPL
            // stod endda to gange — med pris i K2-rækken og uden i
            // RelStyrke-rækken, samme symbol, samme sekund.
            //
            // Årsagen er at `current_price` er et GEMT felt som strategien selv
            // skal skrive, og kun Konfluens 2, Europa- og US-reversion gør det.
            const uden = openViews.filter(v => v.lastPrice == null);
            if (uden.length > 0) {
                const symboler = [...new Set(uden.map(v => v.sym))].join(", ");
                return box("#f59e0b",
                    `⚠ ${uden.length} af ${openViews.length} positioner mangler aktuel pris: `
                  + `<b>${symboler}</b>. Enten har strategien ikke gemt en pris `
                  + `(BuyTheDip, RelStyrke og TrendJoin gør det ikke), eller der `
                  + `er ingen live-kurs for symbolet lige nu.`);
            }
            // ⚠ OG NÅR DER ER EN PRIS PÅ ALLE, ER DET IKKE DET SAMME SOM AT DEN
            // ER AKTUEL. `current_price` har intet tidsstempel i journalen, så
            // en pris skrevet i går kl. 11:50 vises præcis som én skrevet for tre
            // sekunder siden — og urealiseret P&L regnes af den. Det er værre end
            // en manglende pris, fordi tallet ser rigtigt ud.
            //
            // Så længe feltet er uden tidsstempel, kan denne stribe ikke skelne.
            // Fjern denne besked når `current_price_ts` findes og alderen vises
            // ved hver enkelt række.
            return box("#6b7280",
                "Priserne herunder er senest gemte værdier fra strategierne. "
              + "De har intet tidsstempel, så en gammel pris kan ikke skelnes fra en ny.");
        }

        function renderOversigt(today, open, snap) {
            const summary = today.summary || {};
            const todaysTrades = today.trades || [];
            const openPositions = open.positions || [];

            // ── KPI'er ───────────────────────────────────────
            const totalPnl    = summary.total_pnl   || 0;
            const tradesCount = summary.count       || 0;
            const wins        = summary.wins        || 0;
            const losses      = summary.losses      || 0;
            const winRate     = summary.win_rate    || 0;
            const openCount   = summary.open_count  || 0;
            const bestTrade   = summary.best_trade  || 0;
            const worstTrade  = summary.worst_trade || 0;

            // ── Helper: source-pill ──────────────────────────
            const sourcePill = (source) => {
                if (source === "Momentum ORB") return `<span class="pill pill-orb">ORB</span>`;
                if (source === "Konfluens")    return `<span class="pill pill-konfl">Konfluens</span>`;
                if (source === "Konfluens 2")  return `<span class="pill pill-konfl2">Konfluens 2</span>`;
                if (source === "Europa-reversion") return `<span class="pill pill-rev">EUREVERSION</span>`;
                if (source === "US-reversion") return `<span class="pill pill-usrev">USREVERSION</span>`;
                if (source === "BuyTheDip")    return `<span class="pill pill-bd">BuyTheDip</span>`;
                if (source === "Trend Join Long") return `<span class="pill pill-tjl">TrendJoin</span>`;
                if (source === "Relativ Styrke") return `<span class="pill pill-rs">RelStyrke</span>`;
                if (source === "manual")       return `<span class="pill pill-manuel">Manuel</span>`;
                return `<span class="pill" style="background:#333;color:#aaa;">${source}</span>`;
            };

            // ── Helper: side-pill ────────────────────────────
            const sidePill = (side) => side === "long"
                ? `<span class="pill pill-long">Long</span>`
                : `<span class="pill pill-short">Short</span>`;

            // ── Helper: exit-reason-pill ─────────────────────
            const reasonPill = (reason) => {
                if (!reason) return "";
                const cls = ["target","trail","stop","force_close","manual"].includes(reason)
                    ? `pill-reason-${reason}` : "";
                return `<span class="pill ${cls}" style="margin-left:6px;font-size:11px;">${reasonText(reason)}</span>`;
            };

            // Vis dato pænt
            const dateLabel = today.date ? new Date(today.date).toLocaleDateString("da-DK", {
                weekday: "long", year: "numeric", month: "long", day: "numeric"
            }) : "i dag";

            // ── Åbne positioner-tabel (delt beregning med mobil) ──────
            const snapByTicker = buildSnapByTicker(snap);
            const openViews    = sortOpenPositions(openPositions).map(p => computePositionView(p, snapByTicker));
            const headerUnr    = sumUnrealized(openViews, snap);
            const openRows = openViews.length === 0
                ? `<tr><td colspan="13" class="empty">Ingen åbne positioner</td></tr>`
                : openViews.map(v => {
                    const p = v.p;
                    const targetCell = v.stage === "trailing"
                        ? (v.trailStop != null
                            ? `<span style="color:#7ec0ff;font-weight:600;">↗ ${fmtMoney(v.trailStop)}</span>`
                            : "—")
                        : (v.target != null ? fmtMoney(v.target) : "—");
                    // Aktuel pris ("Nu") — altid den live pris så afvigelsen fra entry er synlig.
                    const lastCell = v.lastPrice != null
                        ? `<span style="color:#7ec0ff;">${fmtMoney(v.lastPrice)}</span>`
                        : `<span class="muted">afventer</span>`;
                    const pctText = v.unrPct != null
                        ? ` <span style="font-size:11px;opacity:.75;">(${v.unrPct >= 0 ? "+" : ""}${v.unrPct.toFixed(2)}%)</span>`
                        : "";
                    // Fantom-raekke: journalen har den, IBKR har den ikke. Sig det i
                    // klartekst i stedet for at vise et tal der ikke daekker over noget.
                    const pnlCell = v.confirmed === false
                        ? `<span style="color:#ff9d4d;font-weight:700;" title="Journalen har denne position, men IBKR er flad i ${v.sym}. Der er intet at gøre P&amp;L op på.">ikke hos IBKR</span>`
                        : v.unrPnl != null
                        ? `<span class="${cls(v.unrPnl)}" style="font-weight:700;">${fmtMoneySigned(v.unrPnl)}${pctText}</span>`
                        : `<span class="muted">—</span>`;
                    // Badge ved symbolet: ⚠ = ubekraeftet hos IBKR, ? = feed upaalideligt
                    const confBadge = v.confirmed === false
                        ? ` <span style="background:#5a2d00;color:#ff9d4d;border-radius:3px;padding:1px 5px;font-size:10px;font-weight:700;" title="Ikke bekræftet hos IBKR — tælles ikke med i totalen">⚠ FANTOM</span>`
                        : v.confirmed === null
                        ? ` <span class="muted" style="font-size:10px;" title="Positions-feedet fra IBKR var upålideligt — status ukendt">?</span>`
                        : "";
                    const mCostCell = v.marginCost != null ? fmtMoney(v.marginCost) : "";
                    const mPnlCell = v.marginPnl != null
                        ? `<span class="${cls(v.marginPnl)}" style="font-weight:700;">${fmtMoneySigned(v.marginPnl)}</span>`
                        : `<span class="muted">—</span>`;
                    const mPctCell = v.marginPct != null
                        ? `<span class="${cls(v.marginPct)}" style="font-weight:700;">${v.marginPct >= 0 ? "+" : ""}${v.marginPct.toFixed(2)}%</span>`
                        : `<span class="muted">—</span>`;
                    return `
                        <tr class="row-open">
                            <td>${v.entryTime}</td>
                            <td><strong style="font-size:16px;">${p.symbol}</strong> ${sourcePill(v.source)}${multBadge(v.sym, v.lastPrice != null ? v.lastPrice : v.entry)}${confBadge}</td>
                            <td>${sidePill(v.side)}</td>
                            <td class="num">${v.shares != null ? v.shares : "—"}</td>
                            <td class="num">${v.totalCost != null ? fmtMoney(v.totalCost) : "—"}</td>
                            <td class="num">${v.entry != null ? fmtMoney(v.entry) : "—"}</td>
                            <td class="num">${lastCell}</td>
                            <td class="num">${p.current_stop != null ? fmtMoney(p.current_stop) : "—"}</td>
                            <td class="num">${targetCell}</td>
                            <td class="num">${pnlCell}</td>
                            <td class="num">${mCostCell}</td>
                            <td class="num">${mPnlCell}</td>
                            <td class="num">${mPctCell}</td>
                        </tr>
                    `;
                }).join("");

            // ── Dagens handler-tabel ─────────────────────────
            const tradeRows = todaysTrades.length === 0
                ? `<tr><td colspan="13" class="empty">Ingen handler i dag</td></tr>`
                : todaysTrades.map(t => {
                    const entryTime = fmtTradeTime(t.entry_time_et, t.entry_time_utc);
                    const exitTime = t.exit_time_et
                        ? fmtTradeTime(t.exit_time_et, t.exit_time_utc)
                        : `<span class="open-indicator">Åben</span>`;
                    const exitCell = t.exit_price != null ? fmtMoney(t.exit_price) : "—";
                    const dir  = (t.side === "short") ? -1 : 1;
                    const mult = multForSymbol(t.symbol);
                    const notional = (t.entry_price != null && t.shares != null) ? t.entry_price * t.shares * mult : null;
                    const pricePct = (t.exit_price != null && t.entry_price != null && t.entry_price !== 0)
                        ? ((t.exit_price - t.entry_price) / t.entry_price) * 100 * dir : null;
                    const marginPct = (t.pnl != null) ? (t.pnl / POSITION_SIZE) * 100 : null;
                    const pctSpan = pricePct != null
                        ? ` <span class="${cls(t.pnl)}" style="font-size:11px;font-weight:600;">(${pricePct >= 0 ? "+" : ""}${pricePct.toFixed(2)}%)</span>`
                        : "";
                    const pnlCell = t.pnl != null
                        ? `<span class="${cls(t.pnl)}" style="font-weight:700;">${fmtMoneySigned(t.pnl)}</span>${pctSpan}`
                        : `<span class="muted">—</span>`;
                    const mPnlCell = t.pnl != null
                        ? `<span class="${cls(t.pnl)}" style="font-weight:700;">${fmtMoneySigned(t.pnl)}</span>`
                        : `<span class="muted">—</span>`;
                    const mPctCell = marginPct != null
                        ? `<span class="${cls(marginPct)}" style="font-weight:700;">${marginPct >= 0 ? "+" : ""}${marginPct.toFixed(2)}%</span>`
                        : `<span class="muted">—</span>`;

                    // Farv rækken efter resultat
                    const rowClass = t.pnl == null ? "row-open"
                                   : t.pnl > 0    ? "row-positive"
                                   : t.pnl < 0    ? "row-negative"
                                   : "";

                    return `
                        <tr class="${rowClass}">
                            <td>${entryTime}</td>
                            <td>${exitTime}</td>
                            <td><strong style="font-size:16px;">${t.symbol}</strong> ${sourcePill(t.source)}${livePill(t)}${multBadge(t.symbol, t.entry_price)}</td>
                            <td>${sidePill(t.side)}</td>
                            <td class="num">${t.shares}</td>
                            <td class="num">${fmtMoney(t.entry_price)}</td>
                            <td class="num">${notional != null ? fmtMoney(notional) : "—"}</td>
                            <td class="num">${exitCell}</td>
                            <td class="num">${pnlCell}</td>
                            <td class="num"></td>
                            <td class="num">${mPnlCell}</td>
                            <td class="num">${mPctCell}</td>
                            <td>${reasonPill(t.exit_reason)}</td>
                        </tr>
                    `;
                }).join("");

            // ── Hero-PnL (stort tal øverst) ──────────────────
            const heroPnlClass = totalPnl > 0 ? "positive"
                              : totalPnl < 0 ? "negative"
                              : "muted";

            // ── Saml det hele ────────────────────────────────
            // CSS-media-query skjuler/viser desktop vs mobil version automatisk
            document.getElementById("content").innerHTML = `
                <div class="desktop-only">
                <div class="section-title">Oversigt — ${dateLabel}</div>

                <div class="card">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                        <div class="hero-pnl" style="border-right: 1px solid #3a3a3a;">
                            <div class="hero-pnl-label">Realiseret P&L i dag</div>
                            <div class="hero-pnl-value ${heroPnlClass}">${fmtMoneySigned(totalPnl)}</div>
                            <div class="hero-pnl-meta">
                                ${tradesCount > 0 ? `${tradesCount} handler · ${wins}V / ${losses}T · win rate ${winRate.toFixed(1)}%` : "Ingen lukkede handler endnu"}
                            </div>
                        </div>
                        <div class="hero-pnl">
                            <div class="hero-pnl-label">Urealiseret P&L</div>
                            <div class="hero-pnl-value ${headerUnr != null ? cls(headerUnr) : 'muted'}">${headerUnr != null ? fmtMoneySigned(headerUnr) : '—'}</div>
                            <div class="hero-pnl-meta">
                                ${openViews.length > 0
                                    ? `${openViews.length} ${openViews.length === 1 ? 'åben position' : 'åbne positioner'}`
                                    : 'Ingen åbne positioner'}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="stats-grid">
                        <div>
                            <div class="stat-label">Åbne positioner</div>
                            <div class="stat-value ${openCount > 0 ? '' : 'muted'}">${openCount}</div>
                        </div>
                        <div>
                            <div class="stat-label">Bedste handel</div>
                            <div class="stat-value ${bestTrade > 0 ? 'positive' : 'muted'}">${bestTrade > 0 ? fmtMoneySigned(bestTrade) : "—"}</div>
                        </div>
                        <div>
                            <div class="stat-label">Værste handel</div>
                            <div class="stat-value ${worstTrade < 0 ? 'negative' : 'muted'}">${worstTrade < 0 ? fmtMoneySigned(worstTrade) : "—"}</div>
                        </div>
                    </div>
                </div>

                <div class="section-title">Åbne positioner (${openViews.length})</div>
                ${buildPriceStatusBanner(snap, openViews)}
                <div class="card" style="padding:0;">
                    <table>
                        <thead>
                            <tr>
                                <th>Entry-tid</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th style="text-align:right;">Stk</th>
                                <th style="text-align:right;">Kostpris</th>
                                <th style="text-align:right;">Køb</th>
                                <th style="text-align:right;">Nu</th>
                                <th style="text-align:right;">Stop</th>
                                <th style="text-align:right;">Target / Trail</th>
                                <th style="text-align:right;">P&L</th>
                                <th style="text-align:right;">Margin-kostpris</th>
                                <th style="text-align:right;">Margin-P&L</th>
                                <th style="text-align:right;">Margin-P&L %</th>
                            </tr>
                        </thead>
                        <tbody>${openRows}</tbody>
                    </table>
                </div>

                <div class="section-title">Dagens handler (${todaysTrades.length})</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead>
                            <tr>
                                <th>Entry-tid</th>
                                <th>Exit-tid</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th style="text-align:right;">Stk</th>
                                <th style="text-align:right;">Entry-pris</th>
                                <th style="text-align:right;">Kostpris</th>
                                <th style="text-align:right;">Exit-pris</th>
                                <th style="text-align:right;">P&L</th>
                                <th style="text-align:right;">Margin-kostpris</th>
                                <th style="text-align:right;">Margin-P&L</th>
                                <th style="text-align:right;">Margin-P&L %</th>
                                <th style="padding-left:24px;">Årsag</th>
                            </tr>
                        </thead>
                        <tbody>${tradeRows}</tbody>
                    </table>
                </div>

                <div class="controls">
                    <span>Auto-refresh hver 10s</span>
                    <button onclick="loadOversigtData()">↻ Opdater nu</button>
                </div>
                </div>

                ${renderOversigtMobile(today, open, snap, dateLabel)}
            `;
        }

        // ═══════════════════════════════════════════════════════════════
        // MOBIL-VERSION af Oversigt — vises automatisk på smal skærm
        // (CSS media query @media max-width:768px styrer visning)
        // ═══════════════════════════════════════════════════════════════
        function renderOversigtMobile(today, open, snap, dateLabel) {
            // Lokale pill-hjælpere (renderOversigt's egne er ikke i scope her)
            const sourcePill = (source) => {
                if (source === "Momentum ORB") return `<span class="pill pill-orb">ORB</span>`;
                if (source === "Konfluens")    return `<span class="pill pill-konfl">Konfluens</span>`;
                if (source === "Konfluens 2")  return `<span class="pill pill-konfl2">Konfluens 2</span>`;
                if (source === "Europa-reversion") return `<span class="pill pill-rev">EUREVERSION</span>`;
                if (source === "US-reversion") return `<span class="pill pill-usrev">USREVERSION</span>`;
                if (source === "BuyTheDip")    return `<span class="pill pill-bd">BuyTheDip</span>`;
                if (source === "Trend Join Long") return `<span class="pill pill-tjl">TrendJoin</span>`;
                if (source === "Relativ Styrke") return `<span class="pill pill-rs">RelStyrke</span>`;
                if (source === "manual")       return `<span class="pill pill-manuel">Manuel</span>`;
                return `<span class="pill" style="background:#333;color:#aaa;">${source || "—"}</span>`;
            };
            const sidePill = (side) => side === "long"
                ? `<span class="pill pill-long">Long</span>`
                : `<span class="pill pill-short">Short</span>`;

            const summary = today.summary || {};
            const totalPnl    = summary.total_pnl   || 0;
            const tradesCount = summary.count       || 0;
            const wins        = summary.wins        || 0;
            const losses      = summary.losses      || 0;
            const winRate     = summary.win_rate    || 0;

            const todaysTrades = today.trades || [];
            // ⚠ Listen og tallet foroven ("14H") SKAL taelle det samme.
            //
            // To ting gjorde dem uenige:
            //  1. slice(-5) — tallet sagde 14, listen viste 5. Sammen med
            //     positions-kortene lignede det 6-8 poster, saa det saa ud som om
            //     nogle handler manglede tilfaeldigt frem for at vaere skaaret fra.
            //  2. filter(pnl != null) — summary taeller LUKKEDE (exit_time_utc IS
            //     NOT NULL). En lukket handel uden pnl (fx lukket via reconcile)
            //     ville taelle foroven og forsvinde fra listen. Samme definition
            //     bruges nu begge steder.
            const closedTrades = todaysTrades.filter(t => t.exit_time_utc != null);

            // ── Realiseret P&L blok ──────────────────────────
            const realClass = totalPnl > 0 ? "positive"
                            : totalPnl < 0 ? "negative" : "muted";
            const realMeta  = tradesCount > 0
                ? `${tradesCount}H · ${wins}V/${losses}T · ${winRate.toFixed(0)}%`
                : "Ingen handler";

            // ── Delt beregning: PRAECIS samme tal og felter som desktop ──
            const snapByTicker = buildSnapByTicker(snap);
            const openViews    = sortOpenPositions((open && open.positions) ? open.positions : [])
                                    .map(p => computePositionView(p, snapByTicker));
            const headerUnr    = sumUnrealized(openViews, snap);

            // ── Urealiseret P&L blok (= sum af linjerne, som desktop) ────
            const hasSnap   = snap && snap.ok;
            const unrClass  = headerUnr == null ? "muted"
                            : headerUnr > 0 ? "positive"
                            : headerUnr < 0 ? "negative" : "muted";
            const unrText   = headerUnr == null ? "—" : fmtMoneySigned(headerUnr);
            const posCount  = openViews.length;
            const unrMeta   = !hasSnap ? "Ingen forbindelse"
                            : posCount === 0 ? "0 åbne"
                            : posCount === 1 ? "1 åben"
                            : `${posCount} åbne`;

            const positionCards = openViews.length === 0
                ? `<div class="empty" style="padding:16px; font-size:13px;">Ingen åbne positioner</div>`
                : openViews.map(v => {
                    const pnlClass = v.unrPnl == null ? "muted"
                                   : v.unrPnl > 0 ? "positive"
                                   : v.unrPnl < 0 ? "negative" : "muted";
                    const cardClass = v.unrPnl == null ? ""
                                    : v.unrPnl > 0 ? "win"
                                    : v.unrPnl < 0 ? "loss" : "";
                    const pctText = v.unrPct != null
                        ? `${v.unrPct >= 0 ? "+" : ""}${v.unrPct.toFixed(2)}%` : "—";
                    const lastText = v.lastPrice != null ? fmtMoney(v.lastPrice) : "afventer";
                    const targetText = v.stage === "trailing" && v.trailStop != null
                        ? "↗ " + fmtMoney(v.trailStop)
                        : (v.target != null ? fmtMoney(v.target) : "—");

                    return `
                        <div class="mobile-pos-card ${cardClass}">
                            <div class="mobile-pos-left">
                                <div class="mobile-pos-tickerline">
                                    <span class="mobile-pos-ticker">${v.sym}</span>
                                    ${sourcePill(v.source)}
                                    ${sidePill(v.side)}
                                    ${multBadge(v.sym, v.lastPrice != null ? v.lastPrice : v.entry)}
                                    ${v.confirmed === false
                                        ? `<span style="background:#5a2d00;color:#ff9d4d;border-radius:3px;padding:1px 5px;font-size:10px;font-weight:700;">⚠ FANTOM</span>`
                                        : ""}
                                </div>
                                <div class="mobile-pos-meta">${v.entryTime} · ${v.shares != null ? v.shares : "—"} stk · Kostpris ${v.totalCost != null ? fmtMoney(v.totalCost) : "—"}${v.marginCost != null ? " · Margin " + fmtMoney(v.marginCost) : ""}</div>
                                <div class="mobile-pos-prices">
                                    <span>Køb ${v.entry != null ? fmtMoney(v.entry) : "—"}</span>
                                    <span class="mobile-pos-last">Nu ${lastText}</span>
                                </div>
                                <div class="mobile-pos-meta">Stop ${v.stop != null ? fmtMoney(v.stop) : "—"} · Target ${targetText}</div>
                            </div>
                            <div class="mobile-pos-right">
                                <div class="mobile-pos-pnl ${pnlClass}">${v.confirmed === false ? `<span style="color:#ff9d4d;font-size:12px;">ikke hos IBKR</span>` : v.unrPnl != null ? fmtMoneySigned(v.unrPnl) : "—"}</div>
                                <div class="mobile-pos-pct ${pnlClass}">${pctText}</div>
                                <div class="mobile-pos-pct ${pnlClass}">margin ${v.marginPct != null ? (v.marginPct >= 0 ? "+" : "") + v.marginPct.toFixed(2) + "%" : "—"}</div>
                            </div>
                        </div>
                    `;
                }).join("");

            // ── Seneste handler ──────────────────────────────
            // Alle felter fra journalen. Sorteret nyest SOLGTE først.
            const closedSorted = [...closedTrades].sort((a, b) =>
                (b.exit_time_et || "").localeCompare(a.exit_time_et || ""));
            // ⚠ INGEN slice. Her stod slice(0, 8): toppen sagde "14H", listen viste 8,
            // og der var intet der fortalte at resten var skaaret fra — det lignede
            // manglende data. Vil man se faerre, ruller man bare mindre; vil man se
            // alle, SKAL de vaere der. Antallet staar nu ogsaa i overskriften, saa
            // listen og tallet foroven kan sammenlignes med oejnene.
            const recent = closedSorted;

            const tradeCards = recent.length === 0
                ? `<div class="empty" style="padding:16px; font-size:13px;">Ingen lukkede handler i dag</div>`
                : recent.map(t => {
                    const pnlClass = t.pnl > 0 ? "positive"
                                   : t.pnl < 0 ? "negative" : "muted";
                    const cardClass = t.pnl > 0 ? "win"
                                    : t.pnl < 0 ? "loss" : "";
                    const entryTime = fmtTradeTime(t.entry_time_et, t.entry_time_utc);
                    const exitTime  = t.exit_time_et
                        ? fmtTradeTime(t.exit_time_et, t.exit_time_utc) : "—";
                    const pctText = t.pnl_pct != null
                        ? `${t.pnl_pct >= 0 ? "+" : ""}${t.pnl_pct.toFixed(2)}%` : "—";
                    const _mMult = multForSymbol(t.symbol);
                    const _mNotional = (t.entry_price != null && t.shares != null) ? t.entry_price * t.shares * _mMult : null;
                    const marginPctText = t.pnl != null
                        ? `${(t.pnl / POSITION_SIZE * 100) >= 0 ? "+" : ""}${(t.pnl / POSITION_SIZE * 100).toFixed(2)}%` : "—";

                    return `
                        <div class="mobile-trade-card ${cardClass}">
                            <div class="mobile-trade-left">
                                <div class="mobile-pos-tickerline">
                                    <span class="mobile-trade-ticker">${t.symbol}</span>
                                    ${sourcePill(t.source)}
                                    ${sidePill(t.side)}
                                    ${multBadge(t.symbol, t.entry_price)}
                                </div>
                                <div class="mobile-trade-time">${entryTime} → ${exitTime} · ${t.shares} stk · Kostpris ${_mNotional != null ? fmtMoney(_mNotional) : "—"}</div>
                                <div class="mobile-pos-prices">
                                    <span>Køb ${fmtMoney(t.entry_price)}</span>
                                    <span class="mobile-pos-sell">Salg ${t.exit_price != null ? fmtMoney(t.exit_price) : "—"}</span>
                                </div>
                            </div>
                            <div class="mobile-trade-right">
                                <div class="mobile-trade-pnl ${pnlClass}">${fmtMoneySigned(t.pnl)}</div>
                                <div class="mobile-trade-pct ${pnlClass}">${pctText}</div>
                                <div class="mobile-trade-pct ${pnlClass}">margin ${marginPctText}</div>
                            </div>
                        </div>
                    `;
                }).join("");

            return `
                <div class="mobile-only">
                    <div class="section-title">${dateLabel}</div>

                    <div class="card" style="padding:12px;">
                        <div class="mobile-hero-grid">
                            <div class="mobile-hero-block">
                                <div class="mobile-hero-label">Realiseret</div>
                                <div class="mobile-hero-value ${realClass}">${fmtMoneySigned(totalPnl)}</div>
                                <div class="mobile-hero-meta">${realMeta}</div>
                            </div>
                            <div class="mobile-hero-block">
                                <div class="mobile-hero-label">Urealiseret</div>
                                <div class="mobile-hero-value ${unrClass}">${unrText}</div>
                                <div class="mobile-hero-meta">${unrMeta}</div>
                            </div>
                        </div>
                    </div>

                    <div class="section-title">Åbne positioner (${openViews.length})</div>
                    ${buildPriceStatusBanner(snap, openViews)}
                    <div class="mobile-pos-list">
                        ${positionCards}
                    </div>

                    <div class="section-title" style="margin-top:18px;">Dagens handler (${recent.length})</div>
                    <div class="mobile-pos-list">
                        ${tradeCards}
                    </div>

                    <div style="text-align:center; color:#888; font-size:13px; margin-top:18px;">
                        Auto-opdaterer hver 10s · <a href="javascript:loadOversigtData()" style="color:#5ab0ff;">Opdater nu</a>
                    </div>
                </div>
            `;
        }

        // ─────────────────────────────────────────────────────
        // JOURNAL-SIDE — historisk gennemgang af alle trades
        // ─────────────────────────────────────────────────────
        // State for filtre og paginering
        const JOURNAL_PAGE_SIZE = 25;
        let journalFilters = null;  // initialiseres ved første load
        let journalPage = 0;
        let journalData = null;     // cache af seneste respons

        function initJournalFilters() {
            // Default: sidste 7 dage, alt valgt
            const today = new Date();
            const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            const toISODate = d => d.toISOString().substring(0, 10);
            return {
                date_from: toISODate(sevenDaysAgo),
                date_to: toISODate(today),
                source: "",      // tom = alle
                symbol: "",      // tom = alle
                status: "all",   // all | open | closed
                handelstype: "", // "" = begge, "paper", "live"
            };
        }

        async function showJournal() {
            if (!journalFilters) {
                journalFilters = initJournalFilters();
                journalPage = 0;
            }

            // Render skelet med filterbar straks (god UX)
            renderJournalShell();

            // Hent data
            await loadJournalData();

            // Auto-refresh hver 30 sek
            journalTimer = setInterval(() => {
                if (currentPage === "journal") loadJournalData();
            }, 30_000);
        }

        function renderJournalShell() {
            // Render hele siden inkl. filterbar — tabellen bliver indsat senere
            const f = journalFilters;
            const sourceOptions = buildStrategiOptions(f.source, "Alle strategier");

            const statusOptions = [
                ["all",    "Alle"],
                ["closed", "Lukkede"],
                ["open",   "Åbne"],
            ].map(([val, label]) => `
                <option value="${val}" ${val === f.status ? "selected" : ""}>${label}</option>
            `).join("");

            document.getElementById("content").innerHTML = `
                <div class="section-title">Journal — historisk gennemgang</div>

                <div class="card journal-filterbar">
                    <div class="filter-grid">
                        <div class="filter-field">
                            <label for="f-date-from-txt">Fra dato</label>
                            <div class="dk-date-row">
                                <input type="text" id="f-date-from-txt" placeholder="dd-mm-åååå" inputmode="numeric" value="${dkDate(f.date_from)}">
                                <input type="date" id="f-date-from" class="dk-date-hidden" value="${f.date_from}">
                                <button type="button" class="dk-cal-btn" onclick="openDatePicker('f-date-from')" title="Vælg dato">📅</button>
                            </div>
                        </div>
                        <div class="filter-field">
                            <label for="f-date-to-txt">Til dato</label>
                            <div class="dk-date-row">
                                <input type="text" id="f-date-to-txt" placeholder="dd-mm-åååå" inputmode="numeric" value="${dkDate(f.date_to)}">
                                <input type="date" id="f-date-to" class="dk-date-hidden" value="${f.date_to}">
                                <button type="button" class="dk-cal-btn" onclick="openDatePicker('f-date-to')" title="Vælg dato">📅</button>
                            </div>
                        </div>
                        <div class="filter-field">
                            <label for="f-source">Strategi</label>
                            <select id="f-source">${sourceOptions}</select>
                        </div>
                        <div class="filter-field">
                            <label for="f-symbol">Symbol</label>
                            <input type="text" id="f-symbol" maxlength="8"
                                   placeholder="fx CLOV" value="${f.symbol}"
                                   style="text-transform:uppercase;">
                        </div>
                        <div class="filter-field">
                            <label for="f-status">Status</label>
                            <select id="f-status">${statusOptions}</select>
                        </div>
                        <div class="filter-field">
                            <label for="f-handelstype">Handelstype</label>
                            <select id="f-handelstype">
                                <option value=""${f.handelstype ? "" : " selected"}>Alle</option>
                                <option value="paper"${f.handelstype === "paper" ? " selected" : ""}>Kun paper</option>
                                <option value="live"${f.handelstype === "live" ? " selected" : ""}>Kun LIVE</option>
                            </select>
                        </div>
                        <div class="filter-field filter-actions">
                            <button id="f-apply" class="btn-primary">Anvend filtre</button>
                            <button id="f-reset" class="btn-secondary">Nulstil</button>
                        </div>
                    </div>
                </div>

                <!-- Dage uden handler. Ligger HER, over tabellen, fordi det er
                     praecis her man undrer sig over et hul. En separat side ville
                     kraeve at man huskede at gaa hen og kigge. -->
                <div id="dagsnoter-baand"></div>

                <div id="journal-results">
                    <div class="card">
                        <div class="empty">Henter handler...</div>
                    </div>
                </div>
            `;

            // Tilkobl event-handlers
            document.getElementById("f-apply").addEventListener("click", applyJournalFilters);
            document.getElementById("f-reset").addEventListener("click", resetJournalFilters);

            // Enter-tasten i felter = anvend
            ["f-date-from-txt", "f-date-to-txt", "f-symbol"].forEach(id => {
                document.getElementById(id).addEventListener("keypress", e => {
                    if (e.key === "Enter") applyJournalFilters();
                });
            });

            // Dropdown-ændring = anvend straks
            ["f-source", "f-status"].forEach(id => {
                document.getElementById(id).addEventListener("change", applyJournalFilters);
            });
        }

        function applyJournalFilters() {
            journalFilters = {
                date_from: parseDk(document.getElementById("f-date-from-txt").value),
                date_to:   parseDk(document.getElementById("f-date-to-txt").value),
                source:    document.getElementById("f-source").value,
                symbol:    document.getElementById("f-symbol").value.toUpperCase().trim(),
                status:    document.getElementById("f-status").value,
                handelstype: document.getElementById("f-handelstype").value,
            };
            journalPage = 0;  // reset til side 1 når filtre ændres
            loadJournalData();
        }

        function resetJournalFilters() {
            journalFilters = initJournalFilters();
            journalPage = 0;
            renderJournalShell();
            loadJournalData();
        }

        async function loadJournalData() {
            const f = journalFilters;
            const params = new URLSearchParams();
            if (f.date_from) params.set("date_from", f.date_from);
            if (f.date_to)   params.set("date_to",   f.date_to);
            if (f.source)    params.set("source",    f.source);
            if (f.symbol)    params.set("symbol",    f.symbol);
            if (f.status && f.status !== "all") params.set("status", f.status);
            if (f.handelstype) params.set("handelstype", f.handelstype);
            params.set("limit",  JOURNAL_PAGE_SIZE);
            params.set("offset", journalPage * JOURNAL_PAGE_SIZE);

            try {
                const res = await authFetch(`/journal/trades?${params.toString()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                journalData = await res.json();
                renderJournalResults();
                loadDagsnoter();   // baandet er uafhaengigt — maa ikke vaelte tabellen
            } catch (e) {
                document.getElementById("journal-results").innerHTML = `
                    <div class="card">
                        <div class="error"><strong>Fejl:</strong> ${e.message}</div>
                    </div>
                `;
            }
        }

        // ─────────────────────────────────────────────────────
        // Dagsnoter — dage uden handler
        // ─────────────────────────────────────────────────────
        // ⚠ Baandet bruger KUN datointervallet. Strategi- og symbolfiltret
        // roerer det ikke: filtrerer man paa Konfluens 2 alene, og K2 ikke
        // handlede 8/7 mens BuyTheDip gjorde, saa er 8/7 ingen tom dag. Regnede
        // vi huller ud fra de filtrerede raekker, ville man faa tilbudt at skrive
        // "ferie" paa en dag man sad og handlede.

        // Kun LIVE faar et maerke. Paper er hverdagen og ville blot stoeje; en
        // enkelt live-raekke i en liste af paper-handler er derimod praecis det
        // man skal kunne se uden at lede efter det.
        // Aeldre raekker har paper=null (foer kolonnen fandtes) — de er paper.
        const livePill = (t) => (t && (t.paper === 0 || t.paper === false))
            ? ` <span class="pill pill-live">LIVE</span>` : "";

        const DAGE_DK = ["sø", "ma", "ti", "on", "to", "fr", "lø"];
        let dagsnoteCache = {};   // dato -> note, saa Rediger kan udfylde feltet

        // Escaper OGSAA " og ' — teksten laegges i et value="..."-attribut, og en
        // note der indeholder et anfoerselstegn ville ellers braekke feltet.
        function esc(s) {
            return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function dagsnoteLabel(iso) {
            // T12:00 og ikke T00:00 — ellers kan tidszonen skubbe datoen en dag
            // tilbage, og noten ville staa ud for den forkerte dag.
            const d = new Date(iso + "T12:00:00");
            return `${DAGE_DK[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`;
        }

        async function loadDagsnoter() {
            const el = document.getElementById("dagsnoter-baand");
            if (!el) return;
            const f = journalFilters;
            if (!f || !f.date_from || !f.date_to) { el.innerHTML = ""; return; }
            try {
                const res = await authFetch(
                    `/journal/dagsnoter?date_from=${f.date_from}&date_to=${f.date_to}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                renderDagsnoter(await res.json());
            } catch (e) {
                // Baandet er et tillaeg. Fejler det, skal handelstabellen stadig
                // staa — men fejlen maa ikke skjules, ellers ligner et hul-loest
                // baand en periode uden huller.
                el.innerHTML = `<div class="card dagsnoter-kort">
                    <div class="error">Dage uden handler kunne ikke hentes: ${e.message}</div>
                </div>`;
            }
        }

        function renderDagsnoter(d) {
            const el = document.getElementById("dagsnoter-baand");
            const huller = d.huller || [];
            const forpasset = d.noter_paa_handlede_dage || [];
            dagsnoteCache = {};
            huller.forEach(h => { if (h.note) dagsnoteCache[h.dato] = h.note; });
            forpasset.forEach(n => { dagsnoteCache[n.dato] = n.note; });

            if (!huller.length && !forpasset.length) {
                el.innerHTML = `<div class="card dagsnoter-kort">
                    <div class="dagsnoter-alt-ok">Der er handlet alle
                    ${d.handelsdage} handelsdage i perioden.</div></div>`;
                return;
            }

            const raekker = huller.map(h => {
                // Fremtid og i dag er ikke huller man har overset — de er bare
                // ikke kommet endnu. Uden den skelnen ville hver dag man kigger
                // fremad ligne et problem, og ⚠ ville miste sin betydning.
                const blaeg = h.fremtid || h.i_dag ? " dagsnote-kommende" : "";
                const midt = h.note
                    ? `<span class="dagsnote-tekst">${esc(h.note)}</span>
                       <button class="dagsnote-knap" onclick="dagsnoteRediger('${h.dato}')">✎</button>`
                    : `<span class="dagsnote-tom">${blaeg ? "" : "⚠ "}ingen note</span>
                       <button class="dagsnote-knap" onclick="dagsnoteRediger('${h.dato}')">+ tilføj grund</button>`;
                return `<div class="dagsnote-raekke${blaeg}" id="dagsnote-${h.dato}">
                    <span class="dagsnote-dato">${dagsnoteLabel(h.dato)}</span>
                    <span class="dagsnote-midt">${midt}</span>
                </div>`;
            }).join("");

            // En note paa en dag der VISTE sig at have handler. Sker naar man
            // skriver ferien ind paa forhaand og saa kommer hjem og handler
            // alligevel. Den maa ikke forsvinde tavst — saa var den umulig at rette.
            const advarsler = forpasset.map(n => `
                <div class="dagsnote-forpasset">
                    ⚠ ${dagsnoteLabel(n.dato)} har noten "${esc(n.note)}", men der
                    ER handlet den dag
                    <button class="dagsnote-knap" onclick="dagsnoteSlet('${n.dato}')">slet</button>
                </div>`).join("");

            el.innerHTML = `<div class="card dagsnoter-kort">
                <div class="dagsnoter-overskrift">
                    Dage uden handler i perioden
                    <span class="muted-text">(${huller.length} af ${d.handelsdage} handelsdage)</span>
                </div>
                ${raekker}${advarsler}
            </div>`;
        }

        function dagsnoteRediger(dato) {
            const raekke = document.getElementById(`dagsnote-${dato}`);
            if (!raekke) return;
            const nuvaerende = (dagsnoteCache[dato] || "");
            raekke.querySelector(".dagsnote-midt").innerHTML = `
                <input class="dagsnote-input" id="dagsnote-input-${dato}"
                       value="${esc(nuvaerende)}" placeholder="Fx: Ferie — Mallorca"
                       onkeydown="dagsnoteTast(event, '${dato}')">
                <button class="dagsnote-knap dagsnote-gem" onclick="dagsnoteGem('${dato}')">Gem</button>
                <button class="dagsnote-knap" onclick="loadDagsnoter()">✕</button>
                <span class="dagsnote-fejl" id="dagsnote-fejl-${dato}"></span>`;
            const inp = document.getElementById(`dagsnote-input-${dato}`);
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
        }

        function dagsnoteTast(ev, dato) {
            if (ev.key === "Enter") { ev.preventDefault(); dagsnoteGem(dato); }
            if (ev.key === "Escape") { ev.preventDefault(); loadDagsnoter(); }
        }

        async function dagsnoteSkriv(dato, tekst) {
            const res = await authFetch(`/journal/dagsnoter/${dato}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ note: tekst }),
            });
            if (!res.ok) {
                let grund = `HTTP ${res.status}`;
                try { const j = await res.json(); if (j && j.detail) grund = j.detail; } catch (_) {}
                throw new Error(grund);
            }
            return res.json();
        }

        async function dagsnoteGem(dato) {
            const inp = document.getElementById(`dagsnote-input-${dato}`);
            if (!inp) return;
            const tekst = inp.value.trim();
            const fejlEl = document.getElementById(`dagsnote-fejl-${dato}`);
            fejlEl.textContent = "";
            try {
                await dagsnoteSkriv(dato, tekst);
                dagsnoteCache[dato] = tekst;
                await loadDagsnoter();
            } catch (e) {
                // ⚠ Feltet BLIVER staaende med teksten i. Lukkede det sig som om
                // noten var gemt, ville man miste det man skrev og tro det modsatte
                // — praecis den fejl handelsnoten havde.
                fejlEl.textContent = `Ikke gemt: ${e.message}`;
            }
        }

        async function dagsnoteSlet(dato) {
            try {
                await dagsnoteSkriv(dato, "");
                delete dagsnoteCache[dato];
                await loadDagsnoter();
            } catch (e) {
                alert(`Noten kunne ikke slettes: ${e.message}`);
            }
        }

        function renderJournalResults() {
            const data = journalData;
            const trades = data.trades || [];
            // Backenden returnerer "count" (ikke "total") — accepter begge for robusthed
            const total = data.total ?? data.count ?? 0;
            const totalPages = Math.max(1, Math.ceil(total / JOURNAL_PAGE_SIZE));

            // ── Helper-funktioner (genbrug fra Oversigt) ─────
            const sourcePill = (source) => {
                if (source === "Momentum ORB") return `<span class="pill pill-orb">ORB</span>`;
                if (source === "Konfluens")    return `<span class="pill pill-konfl">Konfluens</span>`;
                if (source === "Konfluens 2")  return `<span class="pill pill-konfl2">Konfluens 2</span>`;
                if (source === "Europa-reversion") return `<span class="pill pill-rev">EUREVERSION</span>`;
                if (source === "US-reversion") return `<span class="pill pill-usrev">USREVERSION</span>`;
                if (source === "BuyTheDip")    return `<span class="pill pill-bd">BuyTheDip</span>`;
                if (source === "Trend Join Long") return `<span class="pill pill-tjl">TrendJoin</span>`;
                if (source === "Relativ Styrke") return `<span class="pill pill-rs">RelStyrke</span>`;
                if (source === "manual")       return `<span class="pill pill-manuel">Manuel</span>`;
                return `<span class="pill" style="background:#333;color:#aaa;">${source}</span>`;
            };
            const sidePill = (side) => side === "long"
                ? `<span class="pill pill-long">Long</span>`
                : `<span class="pill pill-short">Short</span>`;
            const reasonPill = (reason) => {
                if (!reason) return "";
                const cls = ["target","trail","stop","force_close","manual"].includes(reason)
                    ? `pill-reason-${reason}` : "";
                return `<span class="pill ${cls}" style="margin-left:6px;font-size:11px;">${reasonText(reason)}</span>`;
            };

            // ── Summary over HELE det filtrerede sæt (fra backenden) ──
            const summary = data.summary || {};
            const sumCount = summary.count     ?? 0;
            const sumPnl   = summary.total_pnl ?? 0;
            const sumPct   = summary.pnl_pct   ?? 0;
            const sumWinRt = summary.win_rate  ?? 0;
            const hasClosed = sumCount > 0;

            // ── Rækker ───────────────────────────────────────
            const rows = trades.length === 0
                ? `<tr><td colspan="13" class="empty">Ingen handler matcher filtrene</td></tr>`
                : trades.map(t => {
                    const date = t.entry_time_et
                        ? t.entry_time_et.substring(0, 10)
                        : "—";
                    const entryTime = fmtTradeTime(t.entry_time_et, t.entry_time_utc);
                    const exitTime = t.exit_time_et
                        ? fmtTradeTime(t.exit_time_et, t.exit_time_utc)
                        : `<span class="open-indicator">Åben</span>`;
                    const exitCell = t.exit_price != null ? fmtMoney(t.exit_price) : "—";
                    // %-afkast: brug gemt pnl_pct, ellers beregn fra pnl/indskudt kapital.
                    let pctVal = (t.pnl_pct != null) ? t.pnl_pct
                               : (t.pnl != null && t.entry_price && t.shares)
                                   ? (t.pnl / (t.entry_price * t.shares)) * 100
                                   : null;
                    const pctStr = pctVal != null
                        ? ` <span style="font-size:12px;font-weight:400;opacity:0.85;">(${pctVal >= 0 ? "+" : ""}${pctVal.toFixed(2)}%)</span>`
                        : "";
                    const _dir  = (t.side === "short") ? -1 : 1;
                    const _mult = multForSymbol(t.symbol);
                    const _notional = (t.entry_price != null && t.shares != null) ? t.entry_price * t.shares * _mult : null;
                    // Faktisk risiko brugt = afstand entry→stop × $/point × kontrakter.
                    // ≤ risiko-budgettet (kontrakter rundes ned). Det reelle "hvor meget af
                    // budgettet gik til denne position", i stedet for det flade max.
                    const _risikoBrugt = (t.current_stop != null && t.entry_price != null && t.shares != null)
                        ? Math.abs(t.entry_price - t.current_stop) * _mult * t.shares
                        : null;
                    const _pricePct = (t.exit_price != null && t.entry_price != null && t.entry_price !== 0)
                        ? ((t.exit_price - t.entry_price) / t.entry_price) * 100 * _dir : null;
                    const _marginPct = (t.pnl != null) ? (t.pnl / POSITION_SIZE) * 100 : null;
                    const pctSpan = _pricePct != null
                        ? ` <span class="${cls(t.pnl)}" style="font-size:12px;font-weight:600;">(${_pricePct >= 0 ? "+" : ""}${_pricePct.toFixed(2)}%)</span>`
                        : "";
                    const pnlCell = t.pnl != null
                        ? `<span class="${cls(t.pnl)}" style="font-weight:700;">${fmtMoneySigned(t.pnl)}</span>${pctSpan}`
                        : `<span class="muted">—</span>`;
                    const mPnlCell = t.pnl != null
                        ? `<span class="${cls(t.pnl)}" style="font-weight:700;">${fmtMoneySigned(t.pnl)}</span>`
                        : `<span class="muted">—</span>`;
                    const mPctCell = _marginPct != null
                        ? `<span class="${cls(_marginPct)}" style="font-weight:700;">${_marginPct >= 0 ? "+" : ""}${_marginPct.toFixed(2)}%</span>`
                        : `<span class="muted">—</span>`;
                    // Margin (stillet til raadighed) + forrentning paa margin (P&L/margin)
                    const _mg = marginForTrade(t);
                    const _marginRetPct = (_mg.margin != null && _mg.margin > 0 && t.pnl != null)
                        ? (t.pnl / _mg.margin) * 100 : null;
                    const marginCell = _mg.margin != null
                        ? `${fmtMoney(_mg.margin)}${_mg.est ? '<span class="muted" style="font-size:11px;" title="estimat — IBKR-margin ikke fanget for denne handel">&nbsp;~</span>' : ''}`
                        : `<span class="muted">—</span>`;
                    const marginRetCell = _marginRetPct != null
                        ? `<span class="${cls(_marginRetPct)}" style="font-weight:700;">${_marginRetPct >= 0 ? "+" : ""}${_marginRetPct.toFixed(2)}%</span>`
                        : `<span class="muted">—</span>`;
                    const rowClass = t.pnl == null ? "row-open"
                                   : t.pnl > 0    ? "row-positive"
                                   : t.pnl < 0    ? "row-negative" : "";
                    return `
                        <tr class="${rowClass} clickable-row" onclick="openTradeDetail('${t.trade_id}')">
                            <td>${date}</td>
                            <td>${entryTime}</td>
                            <td>${exitTime}</td>
                            <td><strong style="font-size:15px; display:inline-block; min-width:52px;">${t.symbol}</strong>${sourcePill(t.source)}${livePill(t)}${multBadge(t.symbol, t.entry_price)}</td>
                            <td>${sidePill(t.side)}</td>
                            <td class="num">${t.shares}</td>
                            <td class="num">${fmtMoney(t.entry_price)}</td>
                            <td class="num">${_notional != null ? fmtMoney(_notional) : "—"}</td>
                            <td class="num">${marginCell}</td>
                            <td class="num">${exitCell}</td>
                            <td class="num">${_risikoBrugt != null ? fmtMoney(_risikoBrugt) : "—"}</td>
                            <td class="num">${mPnlCell}</td>
                            <td class="num">${mPctCell}</td>
                            <td class="num">${marginRetCell}</td>
                            <td>${reasonPill(t.exit_reason)}</td>
                        </tr>
                    `;
                }).join("");

            // ── Paginerings-knapper ──────────────────────────
            const fromIdx = total === 0 ? 0 : (journalPage * JOURNAL_PAGE_SIZE) + 1;
            const toIdx = Math.min((journalPage + 1) * JOURNAL_PAGE_SIZE, total);
            const prevDisabled = journalPage === 0 ? "disabled" : "";
            const nextDisabled = (journalPage + 1) >= totalPages ? "disabled" : "";

            // ⚠ Blander tallene paper og rigtige penge? Sig det. En win rate paa
            // 58 % kan vaere seks paper-handler og to live — ét tal ud af to
            // uforenelige ting, og INTET ville fejle.
            const sum = data.summary || {};
            const blandingsvarsel = sum.blandet ? `
                <div class="blandet-advarsel">
                    ⚠ Tallene herunder dækker BÅDE paper og LIVE
                    (${(sum.typer || []).join(" + ")}). De må ikke lægges sammen —
                    vælg handelstype i filtret for at se dem hver for sig.
                </div>` : "";

            document.getElementById("journal-results").innerHTML = `
                <div class="card journal-summary">
                    ${blandingsvarsel}
                    <div class="journal-summary-grid">
                        <div>
                            <div class="stat-label">I alt fundet</div>
                            <div class="stat-value">${total}</div>
                        </div>
                        <div>
                            <div class="stat-label">Viser side</div>
                            <div class="stat-value">${journalPage + 1} / ${totalPages}
                                <span style="font-size:13px;color:#a0a0a0;font-weight:400;margin-left:8px;">
                                    (${fromIdx}–${toIdx})
                                </span>
                            </div>
                        </div>
                        <div>
                            <div class="stat-label">P&L (alle valgte)</div>
                            <div class="stat-value ${cls(sumPnl)}">${hasClosed ? fmtMoneySigned(sumPnl) : "—"}
                                <span style="font-size:15px; font-weight:600; margin-left:8px;">${hasClosed ? "(" + (sumPct >= 0 ? "+" : "") + sumPct.toFixed(2) + "%)" : ""}</span>
                            </div>
                        </div>
                        <div>
                            <div class="stat-label">Win rate (alle valgte)</div>
                            <div class="stat-value ${sumWinRt >= 50 ? 'positive' : (hasClosed ? 'negative' : 'muted')}">${hasClosed ? sumWinRt.toFixed(1) + "%" : "—"}
                                <span style="font-size:13px;color:#a0a0a0;font-weight:400;margin-left:6px;">${hasClosed ? "(" + sumCount + " lukkede)" : ""}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card" style="padding:0; width:fit-content; max-width:100%; overflow-x:auto;">
                    <table class="journal-table">
                        <thead>
                            <tr>
                                <th>Dato</th>
                                <th>Entry<br>tid</th>
                                <th>Exit<br>tid</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th style="text-align:right;">Stk</th>
                                <th style="text-align:right;">Entry<br>pris</th>
                                <th style="text-align:right;" title="Notionel eksponering = pris × antal × multiplikator (hele kontraktværdien)">Eksponering</th>
                                <th style="text-align:right;" title="Margin = kapital stillet til rådighed for handlen. Faktisk fra IBKR hvis fanget, ellers estimat (~). Aktier: kontant indskud.">Margin</th>
                                <th style="text-align:right;">Exit<br>pris</th>
                                <th style="text-align:right;">Risiko<br>($)</th>
                                <th style="text-align:right;">P&L</th>
                                <th style="text-align:right;" title="P&L i % af display-budgettet ($1.000) — sammenligneligt på tværs af handler">P&L %</th>
                                <th style="text-align:right;" title="Forrentning = P&L i % af den margin du stillede til rådighed (P&L / margin)">Afkast %<br>(margin)</th>
                                <th style="padding-left:24px;">Årsag</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>

                <div class="journal-pagination">
                    <button onclick="goToJournalPage(0)" ${prevDisabled}>« Første</button>
                    <button onclick="goToJournalPage(${journalPage - 1})" ${prevDisabled}>‹ Forrige</button>
                    <span class="page-info">Side ${journalPage + 1} af ${totalPages}</span>
                    <button onclick="goToJournalPage(${journalPage + 1})" ${nextDisabled}>Næste ›</button>
                    <button onclick="goToJournalPage(${totalPages - 1})" ${nextDisabled}>Sidste »</button>
                </div>
            `;
        }

        function goToJournalPage(page) {
            const data = journalData;
            if (!data) return;
            const totalPages = Math.max(1, Math.ceil((data.total || 0) / JOURNAL_PAGE_SIZE));
            if (page < 0 || page >= totalPages) return;
            journalPage = page;
            loadJournalData();
        }

        // ─────────────────────────────────────────────────────
        // TRADE DETAIL — modal med fuld info pr. trade
        // ─────────────────────────────────────────────────────
        async function openTradeDetail(tradeId) {
            // Opret overlay straks med loading-tilstand
            const overlay = document.createElement("div");
            overlay.id = "trade-detail-overlay";
            overlay.className = "modal-overlay";
            overlay.onclick = (e) => { if (e.target === overlay) closeTradeDetail(); };
            overlay.innerHTML = `
                <div class="modal-window trade-detail-modal">
                    <div id="trade-detail-body">
                        <div class="empty" style="padding:60px;">Indlæser handel...</div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            document.addEventListener("keydown", handleTradeDetailKeydown);

            // Hent fuld trade-data
            try {
                const res = await authFetch(`/journal/trades/${tradeId}`);
                if (!res.ok) {
                    if (res.status === 404) throw new Error("Handlen findes ikke længere");
                    throw new Error(`HTTP ${res.status}`);
                }
                const trade = await res.json();
                renderTradeDetail(trade);
            } catch (e) {
                document.getElementById("trade-detail-body").innerHTML = `
                    <div class="modal-header">
                        <div class="modal-title" style="color:#ff8a8a;">Fejl</div>
                        <button class="modal-close-btn" onclick="closeTradeDetail()">✕ Luk</button>
                    </div>
                    <div class="modal-content">
                        <div class="error">${e.message}</div>
                    </div>
                `;
            }
        }

        function closeTradeDetail() {
            const overlay = document.getElementById("trade-detail-overlay");
            if (overlay) overlay.remove();
            document.removeEventListener("keydown", handleTradeDetailKeydown);
        }

        function handleTradeDetailKeydown(e) {
            if (e.key === "Escape") closeTradeDetail();
        }

        function renderTradeDetail(trade) {
            // ── Helpers (gentaget her for at modalen er self-contained) ──
            const sourceBadge = (src) => {
                if (src === "Momentum ORB") return `<span class="pill pill-orb">Momentum ORB</span>`;
                if (src === "Konfluens")    return `<span class="pill pill-konfl">Konfluens</span>`;
                if (src === "Konfluens 2")  return `<span class="pill pill-konfl2">Konfluens 2</span>`;
                if (src === "Europa-reversion") return `<span class="pill pill-rev">EUREVERSION</span>`;
                if (src === "BuyTheDip")    return `<span class="pill pill-bd">BuyTheDip</span>`;
                if (src === "Trend Join Long") return `<span class="pill pill-tjl">TrendJoin</span>`;
                if (src === "Relativ Styrke") return `<span class="pill pill-rs">RelStyrke</span>`;
                if (src === "US-reversion") return `<span class="pill pill-usrev">USREVERSION</span>`;
                if (src === "manual")       return `<span class="pill pill-manuel">Manuel</span>`;
                return `<span class="pill" style="background:#333;color:#aaa;">${src}</span>`;
            };
            const sideBadge = (side) => side === "long"
                ? `<span class="pill pill-long">Long</span>`
                : `<span class="pill pill-short">Short</span>`;

            // ── Dato + tider ─────────────────────────────────
            const dateStr = trade.entry_time_et
                ? trade.entry_time_et.substring(0, 10)
                : "—";
            const entryTimeET = trade.entry_time_et
                ? trade.entry_time_et.substring(11, 16) + " ET"
                : "—";
            const exitTimeET = trade.exit_time_et
                ? trade.exit_time_et.substring(11, 16) + " ET"
                : `<span class="open-indicator">Åben</span>`;

            // Dansk tid — beregn fra UTC (Europe/Copenhagen, DST-korrekt).
            const entryTimeDansk = _dkFromUtc(trade.entry_time_utc);
            const exitTimeDansk  = _dkFromUtc(trade.exit_time_utc);

            // ── Varighed ─────────────────────────────────────
            const durationStr = trade.duration_sec != null
                ? `${Math.floor(trade.duration_sec / 60)} min ${trade.duration_sec % 60} sek`
                : "—";

            // ── P&L formatting ───────────────────────────────
            const pnlText = trade.pnl != null
                ? fmtMoneySigned(trade.pnl)
                : "—";
            const pnlPctText = trade.pnl_pct != null
                ? ` (${trade.pnl_pct >= 0 ? "+" : ""}${trade.pnl_pct.toFixed(2)}%)`
                : "";
            const pnlClass = cls(trade.pnl);

            // ── Status-indikator i header ────────────────────
            const isOpen = trade.exit_time_et == null;
            const statusIndicator = isOpen
                ? `<span class="open-indicator" style="margin-left:auto;">Position åben</span>`
                : trade.pnl > 0
                    ? `<span style="margin-left:auto; color:#5ee99a; font-weight:700;">✓ Lukket med gevinst</span>`
                    : trade.pnl < 0
                        ? `<span style="margin-left:auto; color:#ff8a8a; font-weight:700;">✗ Lukket med tab</span>`
                        : `<span style="margin-left:auto; color:#a0a0a0;">Lukket</span>`;

            // ── Payload — formatteret JSON ───────────────────
            const payloadJson = trade.payload && Object.keys(trade.payload).length > 0
                ? JSON.stringify(trade.payload, null, 2)
                : "(intet payload data)";

            // ── Saml alt ─────────────────────────────────────
            document.getElementById("trade-detail-body").innerHTML = `
                <div class="modal-header">
                    <div class="modal-title">
                        <span style="font-size:24px;color:#ffffff;font-weight:800;">${trade.symbol}</span>
                        <span style="margin-left:12px;">${sourceBadge(trade.source)}</span>
                        <span style="margin-left:6px;">${sideBadge(trade.side)}</span>
                    </div>
                    <button class="modal-close-btn" onclick="closeTradeDetail()" title="Luk (ESC)">✕ Luk</button>
                </div>

                <div class="modal-content">
                    <!-- Sub-header: dato, shares, P&L -->
                    <div class="trade-subheader">
                        <span><strong>${dateStr}</strong></span>
                        <span class="trade-subheader-divider">·</span>
                        <span>${trade.shares} stk</span>
                        ${trade.pnl != null ? `
                            <span class="trade-subheader-divider">·</span>
                            <span class="${pnlClass}" style="font-weight:700;font-size:18px;">
                                ${pnlText}${pnlPctText}
                            </span>
                        ` : ""}
                        ${statusIndicator}
                    </div>

                    <!-- ENTRY-sektion -->
                    <div class="detail-section">
                        <div class="detail-section-title">Entry</div>
                        <div class="detail-grid">
                            <div class="detail-row">
                                <div class="detail-label">Tid</div>
                                <div class="detail-value">${entryTimeDansk ? `${entryTimeDansk} <span class="muted-text">(${entryTimeET})</span>` : entryTimeET}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Pris</div>
                                <div class="detail-value">${fmtMoney(trade.entry_price)}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Stop</div>
                                <div class="detail-value">${trade.current_stop != null ? fmtMoney(trade.current_stop) : "—"}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Target</div>
                                <div class="detail-value">${trade.current_target != null ? fmtMoney(trade.current_target) : "—"}</div>
                            </div>
                            ${trade.entry_reason ? `
                                <div class="detail-row detail-row-full">
                                    <div class="detail-label">Entry-grund</div>
                                    <div class="detail-value">${trade.entry_reason}</div>
                                </div>
                            ` : ""}
                        </div>
                    </div>

                    <!-- EXIT-sektion -->
                    <div class="detail-section">
                        <div class="detail-section-title">Exit</div>
                        ${isOpen ? `
                            <div class="empty" style="padding:20px;">
                                <span class="open-indicator">Positionen er stadig åben</span>
                            </div>
                        ` : `
                            <div class="detail-grid">
                                <div class="detail-row">
                                    <div class="detail-label">Tid</div>
                                    <div class="detail-value">${exitTimeDansk ? `${exitTimeDansk} <span class="muted-text">(${exitTimeET})</span>` : exitTimeET}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Pris</div>
                                    <div class="detail-value">${fmtMoney(trade.exit_price)}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Grund</div>
                                    <div class="detail-value">${reasonText(trade.exit_reason) || "—"}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Varighed</div>
                                    <div class="detail-value">${durationStr}</div>
                                </div>
                            </div>
                        `}
                    </div>

                    <!-- P&L-sektion -->
                    ${trade.pnl != null ? `
                        <div class="detail-section">
                            <div class="detail-section-title">Resultat</div>
                            <div class="detail-grid">
                                <div class="detail-row">
                                    <div class="detail-label">Realiseret P&L</div>
                                    <div class="detail-value ${pnlClass}" style="font-size:18px;font-weight:700;">${pnlText}${pnlPctText}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Kapital brugt</div>
                                    <div class="detail-value">${trade.capital_used != null ? fmtMoney(trade.capital_used) : "—"}</div>
                                </div>
                            </div>
                        </div>
                    ` : ""}

                    <!-- NOTES-sektion -->
                    <div class="detail-section">
                        <div class="detail-section-title-row">
                            <span class="detail-section-title-text">Notes</span>
                            <button id="notes-edit-btn" class="notes-edit-btn"
                                    onclick="enterNotesEdit('${trade.trade_id}')">
                                ✏ Rediger
                            </button>
                        </div>
                        <div id="notes-display" class="detail-notes-readonly">
                            ${trade.notes
                                ? trade.notes.replace(/</g, "&lt;").replace(/>/g, "&gt;")
                                : "<span class='muted-text'>Ingen notes endnu — klik Rediger for at tilføje</span>"}
                        </div>
                        <div id="notes-edit" class="notes-edit-wrapper" style="display:none;">
                            <textarea id="notes-textarea" class="notes-textarea"
                                      placeholder="Tilføj læring, observationer eller kontekst om denne handel...">${
                                trade.notes ? trade.notes.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""
                            }</textarea>
                            <div id="notes-edit-error" class="notes-edit-error"></div>
                            <div id="notes-kvittering" class="notes-kvittering"
                                 style="display:none;"></div>
                            <div class="notes-edit-actions">
                                <button class="btn-primary notes-save-btn"
                                        onclick="saveNotes('${trade.trade_id}')">💾 Gem</button>
                                <button class="btn-secondary"
                                        onclick="cancelNotesEdit()">Annuller</button>
                            </div>
                        </div>
                    </div>

                    <!-- FORENSICS-sektion (collapsed accordion) -->
                    <details class="detail-forensics">
                        <summary>
                            <span>▶ Forensics — rå data (klik for at se)</span>
                        </summary>
                        <pre class="detail-payload">${payloadJson.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>
                    </details>
