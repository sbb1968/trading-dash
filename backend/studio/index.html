    <script>
        // ─────────────────────────────────────────────────────
        // Auth — login-overlay og token-lagring
        // ─────────────────────────────────────────────────────
        const TOKEN_KEY = "tdstudio_token";

        function getToken() {
            return localStorage.getItem(TOKEN_KEY);
        }

        function setToken(token) {
            localStorage.setItem(TOKEN_KEY, token);
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_KEY);
        }

        // ── Peer-valg: hvilken maskine kigger vi på? ──────────
        // selectedPeer === null betyder "denne lokale maskine" (Bearer-token).
        // Ellers et peer-objekt fra peers.json — så kalder vi peerens URL
        // med X-Internal-Key i stedet (Vej A: browseren kender nøglen).
        let selectedPeer = null;
        let internalKey  = null;   // hentes fra /internal-key efter login
        let knownPeers   = [];     // cache af peers.json

        async function loadInternalKey() {
            // Nøglen hentes ALTID fra den lokale maskine — aldrig fra en peer.
            // (Vi kan ikke nå en peer uden nøglen, så vi må hente den lokalt først.)
            try {
                const token = getToken();
                const res = await fetch("/internal-key", {
                    headers: token ? { Authorization: `Bearer ${token}` } : {},
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                internalKey = data.internal_key || null;
            } catch (e) {
                console.warn("[Peer] Kunne ikke hente intern nøgle:", e);
                internalKey = null;
            }
        }

        async function loadPeerSelector() {
            try {
                const res = await fetch("/peers");
                const data = await res.json();
                knownPeers = (data.peers || []).filter(p => p.enabled && p.url);
            } catch (e) {
                knownPeers = [];
            }

            const sel = document.getElementById("peer-selector");
            if (!sel) return;

            sel.innerHTML = `<option value="">Denne maskine</option>` +
                knownPeers.map(p => `<option value="${p.id}">${p.name}</option>`).join("");

            sel.onchange = () => {
                const id = sel.value;
                selectedPeer = id ? knownPeers.find(p => p.id === id) : null;
                // Analyse viser altid ALLE maskiner — den skal ikke genindlæses
                // (og dermed ikke genkontakte en evt. slukket maskine) ved maskineskift.
                if (currentPage !== "analysis") {
                    switchPage(currentPage || "oversigt");
                }
            };
        }

        async function authFetch(url, options = {}) {
            // Lokal maskine valgt → relativ URL + Bearer-token (som før)
            if (!selectedPeer) {
                const token = getToken();
                const headers = {
                    ...(options.headers || {}),
                    ...(token ? { Authorization: `Bearer ${token}` } : {}),
                };
                const res = await fetch(url, { ...options, headers });
                if (res.status === 401) {
                    clearToken();
                    showLogin();
                    throw new Error("Session udløbet");
                }
                return res;
            }

            // Peer valgt → peerens fulde URL + intern nøgle, med timeout
            const fullUrl = `${selectedPeer.url}${url}`;
            const headers = {
                ...(options.headers || {}),
                ...(internalKey ? { "X-Internal-Key": internalKey } : {}),
            };
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);
            try {
                const res = await fetch(fullUrl, { ...options, headers, signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.status === 401) {
                    throw new Error(`Adgang nægtet på ${selectedPeer.name} — tjek at intern nøgle matcher`);
                }
                return res;
            } catch (e) {
                clearTimeout(timeoutId);
                if (e.name === "AbortError") {
                    throw new Error(`${selectedPeer.name} svarer ikke (timeout — maskinen er måske slukket)`);
                }
                // Bevar 401-beskeden hvis det var den vi selv kastede ovenfor
                if (e.message && e.message.startsWith("Adgang nægtet")) {
                    throw e;
                }
                throw new Error(`${selectedPeer.name} ikke tilgængelig`);
            }
        }

        function showLogin() {
            document.getElementById("login-overlay").classList.remove("hidden");
            document.getElementById("login-error").textContent = "";
            document.getElementById("login-password").value = "";
            setTimeout(() => document.getElementById("login-password").focus(), 100);
        }

        function hideLogin() {
            document.getElementById("login-overlay").classList.add("hidden");
        }

        async function attemptLogin() {
            const passwordInput = document.getElementById("login-password");
            const button = document.getElementById("login-button");
            const errorDiv = document.getElementById("login-error");

            const password = passwordInput.value;
            if (!password) {
                errorDiv.textContent = "Indtast password";
                return;
            }

            button.disabled = true;
            button.textContent = "Logger ind...";
            errorDiv.textContent = "";

            try {
                const res = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password }),
                });

                if (!res.ok) {
                    errorDiv.textContent = "Forkert password";
                    return;
                }

                const data = await res.json();
                setToken(data.token);
                hideLogin();
                // Trigger initial side-load nu hvor vi er logget ind
                loadIdentity();
                switchPage(currentPage || "oversigt");
            } catch (e) {
                errorDiv.textContent = "Backend ikke tilgængelig";
            } finally {
                button.disabled = false;
                button.textContent = "Log ind";
            }
        }

        document.getElementById("login-button").addEventListener("click", attemptLogin);
        document.getElementById("login-password").addEventListener("keypress", e => {
            if (e.key === "Enter") attemptLogin();
        });

        async function checkAuthAndStart() {
            // DEV MODE — kun aktivt hvis dev_config.js er loaded
            const devMode = window.DEV_CONFIG?.DEV_MODE === true;
            if (devMode) {
                // Hent ALTID et friskt token i dev-mode. Et gammelt token i
                // localStorage kan være dødt efter en backend-genstart (tokens
                // gemmes kun i backendens hukommelse). Ved altid at hente et nyt
                // undgår vi "spøgelses-token" der ellers tvinger login-skærmen frem.
                try {
                    const res = await fetch("/auth/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ password: window.DEV_CONFIG.DEV_PASSWORD })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setToken(data.token);
                    } else {
                        console.error("[DEV] Auto-login fejlede — tjek password");
                    }
                } catch (e) {
                    console.error("[DEV] Auto-login fejl:", e);
                }
                hideLogin();
                loadIdentity();
                await loadInternalKey();
                await loadPeerSelector();
                switchPage("oversigt");
                return;
            }

            // PROD MODE — original auth-flow
            const token = getToken();
            if (!token) {
                showLogin();
                return;
            }
            try {
                const res = await fetch("/auth/check", {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!res.ok) {
                    clearToken();
                    showLogin();
                    return;
                }
                hideLogin();
                loadIdentity();
                await loadInternalKey();
                await loadPeerSelector();
                switchPage("oversigt");
            } catch (e) {
                showLogin();
            }
        }
        // ─────────────────────────────────────────────────────
        // Formatering
        // ─────────────────────────────────────────────────────
        const fmtMoney = v => {
            if (v === null || v === undefined) return "—";
            const sign = v < 0 ? "-" : "";
            return sign + "$" + Math.abs(v).toLocaleString("da-DK", {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });
        };
        const fmtMoneySigned = v => {
            if (v === null || v === undefined) return "—";
            const sign = v >= 0 ? "+" : "-";
            return sign + "$" + Math.abs(v).toLocaleString("da-DK", {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });
        };
        const fmtPct = v => {
            if (v === null || v === undefined) return "—";
            const sign = v >= 0 ? "+" : "";
            return sign + v.toFixed(2) + "%";
        };
        const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString("da-DK") : "—";
        const fmtDate = iso => iso ? new Date(iso).toLocaleDateString("da-DK") : "—";
        const cls = v => {
            if (v === null || v === undefined || v === 0) return "muted";
            return v > 0 ? "positive" : "negative";
        };

        // ─────────────────────────────────────────────────────
        // Identitet (én gang)
        // ─────────────────────────────────────────────────────
        // ─────────────────────────────────────────────────────
        // Identitet — hentes efter login er bekræftet
        // ─────────────────────────────────────────────────────
        async function loadIdentity() {
            try {
                const res = await authFetch("/account");
                const data = await res.json();
                document.getElementById("identity").textContent =
                    `${data.account_display_name} — ${data.instance_display_name}`;
            } catch (e) {
                document.getElementById("identity").textContent = "Identitet ikke tilgængelig";
            }
        }

        // ─────────────────────────────────────────────────────
        // Router — håndterer side-skift
        // ─────────────────────────────────────────────────────
        let currentPage = "oversigt";
        let accountTimer = null;
        let oversigtTimer = null;
        let journalTimer = null;

        document.getElementById("nav").addEventListener("click", e => {
            const btn = e.target.closest("button[data-page]");
            if (!btn) return;
            const page = btn.dataset.page;
            switchPage(page);
        });

        function switchPage(page) {
            currentPage = page;

            // Opdater tab-styling
            document.querySelectorAll("#nav button").forEach(b => {
                b.classList.toggle("active", b.dataset.page === page);
            });

            // Stop alle timers — ny side starter sine egne hvis nødvendigt
            if (accountTimer) { clearInterval(accountTimer); accountTimer = null; }
            if (strategiesTimer) { clearInterval(strategiesTimer); strategiesTimer = null; }
            if (oversigtTimer) { clearInterval(oversigtTimer); oversigtTimer = null; }
            if (journalTimer) { clearInterval(journalTimer); journalTimer = null; }
            if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }

            // Luk Log-fanens WebSocket når vi forlader fanen
            stopLogStream();

            // Render
            const content = document.getElementById("content");
            content.innerHTML = `<div class="card"><div class="empty">Indlæser...</div></div>`;

            if (page === "oversigt") showOversigt();
            else if (page === "status") showStatus();
            else if (page === "account") showAccount();
            else if (page === "analysis") showAnalysis();
            else if (page === "strategies") showStrategies();
            else if (page === "journal") showJournal();
            else if (page === "log") showLog();
            else showPlaceholder(page);
        }

        function showPlaceholder(page) {
            const labels = {
                backtest: "Backtest",
                log: "Event-log",
            };
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="placeholder-text">
                        <h2 style="color:#aaa">${labels[page] || page}</h2>
                        <p>Bygges i en senere session.</p>
                    </div>
                </div>
            `;
        }

        // ─────────────────────────────────────────────────────
        // OVERSIGT-SIDE — dagens P&L + åbne positioner
        // ─────────────────────────────────────────────────────
        async function showOversigt() {
            await loadOversigtData();
            oversigtTimer = setInterval(() => {
                if (currentPage === "oversigt") loadOversigtData();
            }, 10_000);
        }

        async function loadOversigtData() {
            try {
                // Hent dagens data, åbne positioner OG live konto-snapshot parallelt.
                // Snapshot bruges til at vise urealiseret P&L i hero-toppen.
                const [todayRes, openRes, snapRes] = await Promise.all([
                    authFetch("/journal/today"),
                    authFetch("/journal/open-positions"),
                    authFetch("/account/dash-snapshot"),
                ]);

                if (!todayRes.ok) throw new Error(`HTTP ${todayRes.status} fra /journal/today`);
                if (!openRes.ok)  throw new Error(`HTTP ${openRes.status} fra /journal/open-positions`);

                const today = await todayRes.json();
                const open  = await openRes.json();
                // Snapshot må gerne fejle (fx TWS afbrudt) — vi fortsætter uden urealiseret P&L
                const snap  = snapRes.ok ? await snapRes.json() : null;

                renderOversigt(today, open, snap);
            } catch (e) {
                renderOversigtError("Backend ikke tilgængelig: " + e.message);
            }
        }

        function renderOversigtError(msg) {
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="error"><strong>Fejl:</strong> ${msg}</div>
                    <div class="controls">
                        <span></span>
                        <button onclick="loadOversigtData()">↻ Prøv igen</button>
                    </div>
                </div>
            `;
        }

        function renderOversigt(today, open, snap) {
            const summary = today.summary || {};
            const todaysTrades = today.trades || [];
            const openPositions = open.positions || [];

            // ── KPI'er ───────────────────────────────────────
            const totalPnl    = summary.total_pnl   || 0;
            const tradesCount = summary.count       || 0;
            const wins        = summary.wins        || 0;
            const losses      = summary.losses      || 0;
            const winRate     = summary.win_rate    || 0;
            const openCount   = summary.open_count  || 0;
            const bestTrade   = summary.best_trade  || 0;
            const worstTrade  = summary.worst_trade || 0;

            // ── Helper: source-pill ──────────────────────────
            const sourcePill = (source) => {
                if (source === "Momentum ORB") return `<span class="pill pill-orb">ORB</span>`;
                if (source === "Konfluens")    return `<span class="pill pill-konfl">Konfluens</span>`;
                if (source === "Konfluens 2")  return `<span class="pill pill-konfl2">Konfluens 2</span>`;
                if (source === "manual")       return `<span class="pill pill-manuel">Manuel</span>`;
                return `<span class="pill" style="background:#333;color:#aaa;">${source}</span>`;
            };

            // ── Helper: side-pill ────────────────────────────
            const sidePill = (side) => side === "long"
                ? `<span class="pill pill-long">Long</span>`
                : `<span class="pill pill-short">Short</span>`;

            // ── Helper: exit-reason-pill ─────────────────────
            const reasonPill = (reason) => {
                if (!reason) return "";
                const cls = ["target","trail","stop","force_close","manual"].includes(reason)
                    ? `pill-reason-${reason}` : "";
                return `<span class="pill ${cls}" style="margin-left:6px;font-size:11px;">${reason}</span>`;
            };

            // Vis dato pænt
            const dateLabel = today.date ? new Date(today.date).toLocaleDateString("da-DK", {
                weekday: "long", year: "numeric", month: "long", day: "numeric"
            }) : "i dag";

            // ── Åbne positioner-tabel ────────────────────────
            // Urealiseret P&L pr. position hentes fra live-snapshot (snap),
            // præcis som mobil-versionen — journalen selv har ikke live-tallet.
            const snapByTicker = {};
            if (snap && snap.ok && snap.positions) {
                for (const sp of snap.positions) {
                    if (sp.ticker) snapByTicker[sp.ticker.toUpperCase()] = sp;
                }
            }
            const openRows = openPositions.length === 0
                ? `<tr><td colspan="8" class="empty">Ingen åbne positioner</td></tr>`
                : openPositions.map(p => {
                    const stage = p.current_stage || "—";
                    const targetCell = p.current_stage === "trailing"
                        ? (p.trail_stop != null
                            ? `<span style="color:#7ec0ff;font-weight:600;">↗ ${fmtMoney(p.trail_stop)}</span>`
                            : "—")
                        : (p.current_target != null ? fmtMoney(p.current_target) : "—");
                    const entryTime = p.entry_time_et
                        ? p.entry_time_et.substring(11, 16) + " ET"
                        : "—";
                    const live   = snapByTicker[(p.symbol || "").toUpperCase()] || null;
                    const unrPnl = live && live.pnl != null ? live.pnl : null;
                    const pnlCell = unrPnl != null
                        ? `<span class="${cls(unrPnl)}" style="font-weight:700;">${fmtMoneySigned(unrPnl)}</span>`
                        : `<span class="muted">—</span>`;
                    return `
                        <tr class="row-open">
                            <td>${entryTime}</td>
                            <td><strong style="font-size:16px;">${p.symbol}</strong> ${sourcePill(p.source)}</td>
                            <td>${sidePill(p.side)}</td>
                            <td class="num">${p.shares}</td>
                            <td class="num">${fmtMoney(p.entry_price)}</td>
                            <td class="num">${p.current_stop != null ? fmtMoney(p.current_stop) : "—"}</td>
                            <td class="num">${targetCell}</td>
                            <td class="num">${pnlCell}</td>
                        </tr>
                    `;
                }).join("");

            // ── Dagens handler-tabel ─────────────────────────
            const tradeRows = todaysTrades.length === 0
                ? `<tr><td colspan="8" class="empty">Ingen handler i dag</td></tr>`
                : todaysTrades.map(t => {
                    const entryTime = t.entry_time_et
                        ? t.entry_time_et.substring(11, 16) + " ET"
                        : "—";
                    const exitTime = t.exit_time_et
                        ? t.exit_time_et.substring(11, 16) + " ET"
                        : `<span class="open-indicator">Åben</span>`;
                    const exitCell = t.exit_price != null ? fmtMoney(t.exit_price) : "—";
                    const pnlCell = t.pnl != null
                        ? `<span class="${cls(t.pnl)}" style="font-weight:700;">${fmtMoneySigned(t.pnl)}</span>`
                        : `<span class="muted">—</span>`;

                    // Farv rækken efter resultat
                    const rowClass = t.pnl == null ? "row-open"
                                   : t.pnl > 0    ? "row-positive"
                                   : t.pnl < 0    ? "row-negative"
                                   : "";

                    return `
                        <tr class="${rowClass}">
                            <td>${entryTime}</td>
                            <td>${exitTime}</td>
                            <td><strong style="font-size:16px;">${t.symbol}</strong> ${sourcePill(t.source)}</td>
                            <td>${sidePill(t.side)}</td>
                            <td class="num">${t.shares}</td>
                            <td class="num">${fmtMoney(t.entry_price)}</td>
                            <td class="num">${exitCell}</td>
                            <td class="num">${pnlCell}${reasonPill(t.exit_reason)}</td>
                        </tr>
                    `;
                }).join("");

            // ── Hero-PnL (stort tal øverst) ──────────────────
            const heroPnlClass = totalPnl > 0 ? "positive"
                              : totalPnl < 0 ? "negative"
                              : "muted";

            // ── Saml det hele ────────────────────────────────
            // CSS-media-query skjuler/viser desktop vs mobil version automatisk
            document.getElementById("content").innerHTML = `
                <div class="desktop-only">
                <div class="section-title">Oversigt — ${dateLabel}</div>

                <div class="card">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                        <div class="hero-pnl" style="border-right: 1px solid #3a3a3a;">
                            <div class="hero-pnl-label">Realiseret P&L i dag</div>
                            <div class="hero-pnl-value ${heroPnlClass}">${fmtMoneySigned(totalPnl)}</div>
                            <div class="hero-pnl-meta">
                                ${tradesCount > 0 ? `${tradesCount} handler · ${wins}V / ${losses}T · win rate ${winRate.toFixed(1)}%` : "Ingen lukkede handler endnu"}
                            </div>
                        </div>
                        <div class="hero-pnl">
                            <div class="hero-pnl-label">Urealiseret P&L</div>
                            <div class="hero-pnl-value ${snap && snap.ok ? cls(snap.unrealized_pnl) : 'muted'}">${snap && snap.ok ? fmtMoneySigned(snap.unrealized_pnl) : '—'}</div>
                            <div class="hero-pnl-meta">
                                ${snap && snap.ok
                                    ? (snap.positions && snap.positions.length > 0
                                        ? `${snap.positions.length} ${snap.positions.length === 1 ? 'åben position' : 'åbne positioner'}`
                                        : 'Ingen åbne positioner')
                                    : 'Konto-data utilgængelig'}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="stats-grid">
                        <div>
                            <div class="stat-label">Åbne positioner</div>
                            <div class="stat-value ${openCount > 0 ? '' : 'muted'}">${openCount}</div>
                        </div>
                        <div>
                            <div class="stat-label">Bedste handel</div>
                            <div class="stat-value ${bestTrade > 0 ? 'positive' : 'muted'}">${bestTrade > 0 ? fmtMoneySigned(bestTrade) : "—"}</div>
                        </div>
                        <div>
                            <div class="stat-label">Værste handel</div>
                            <div class="stat-value ${worstTrade < 0 ? 'negative' : 'muted'}">${worstTrade < 0 ? fmtMoneySigned(worstTrade) : "—"}</div>
                        </div>
                    </div>
                </div>

                <div class="section-title">Åbne positioner (${openPositions.length})</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead>
                            <tr>
                                <th>Entry-tid</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th style="text-align:right;">Stk</th>
                                <th style="text-align:right;">Entry</th>
                                <th style="text-align:right;">Stop</th>
                                <th style="text-align:right;">Target / Trail</th>
                                <th style="text-align:right;">P&L</th>
                            </tr>
                        </thead>
                        <tbody>${openRows}</tbody>
                    </table>
                </div>

                <div class="section-title">Dagens handler (${todaysTrades.length})</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead>
                            <tr>
                                <th>Entry-tid</th>
                                <th>Exit-tid</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th style="text-align:right;">Stk</th>
                                <th style="text-align:right;">Entry-pris</th>
                                <th style="text-align:right;">Exit-pris</th>
                                <th style="text-align:right;">P&L</th>
                            </tr>
                        </thead>
                        <tbody>${tradeRows}</tbody>
                    </table>
                </div>

                <div class="controls">
                    <span>Auto-refresh hver 10s</span>
                    <button onclick="loadOversigtData()">↻ Opdater nu</button>
                </div>
                </div>

                ${renderOversigtMobile(today, open, snap, dateLabel)}
            `;
        }

        // ═══════════════════════════════════════════════════════════════
        // MOBIL-VERSION af Oversigt — vises automatisk på smal skærm
        // (CSS media query @media max-width:768px styrer visning)
        // ═══════════════════════════════════════════════════════════════
        function renderOversigtMobile(today, open, snap, dateLabel) {
            // Lokale pill-hjælpere (renderOversigt's egne er ikke i scope her)
            const sourcePill = (source) => {
                if (source === "Momentum ORB") return `<span class="pill pill-orb">ORB</span>`;
                if (source === "Konfluens")    return `<span class="pill pill-konfl">Konfluens</span>`;
                if (source === "Konfluens 2")  return `<span class="pill pill-konfl2">Konfluens 2</span>`;
                if (source === "manual")       return `<span class="pill pill-manuel">Manuel</span>`;
                return `<span class="pill" style="background:#333;color:#aaa;">${source || "—"}</span>`;
            };
            const sidePill = (side) => side === "long"
                ? `<span class="pill pill-long">Long</span>`
                : `<span class="pill pill-short">Short</span>`;

            const summary = today.summary || {};
            const totalPnl    = summary.total_pnl   || 0;
            const tradesCount = summary.count       || 0;
            const wins        = summary.wins        || 0;
            const losses      = summary.losses      || 0;
            const winRate     = summary.win_rate    || 0;

            const todaysTrades = today.trades || [];
            const closedTrades = todaysTrades.filter(t => t.pnl != null);
            const recentTrades = closedTrades.slice(-5).reverse();  // nyeste først, max 5

            // ── Realiseret P&L blok ──────────────────────────
            const realClass = totalPnl > 0 ? "positive"
                            : totalPnl < 0 ? "negative" : "muted";
            const realMeta  = tradesCount > 0
                ? `${tradesCount}H · ${wins}V/${losses}T · ${winRate.toFixed(0)}%`
                : "Ingen handler";

            // ── Urealiseret P&L blok ─────────────────────────
            const hasSnap   = snap && snap.ok;
            const unrPnl    = hasSnap ? snap.unrealized_pnl : null;
            const unrClass  = !hasSnap ? "muted"
                            : unrPnl > 0 ? "positive"
                            : unrPnl < 0 ? "negative" : "muted";
            const unrText   = !hasSnap ? "—" : fmtMoneySigned(unrPnl);
            const posCount  = hasSnap && snap.positions ? snap.positions.length : 0;
            const unrMeta   = !hasSnap ? "Ingen forbindelse"
                            : posCount === 0 ? "0 åbne"
                            : posCount === 1 ? "1 åben"
                            : `${posCount} åbne`;

            // ── Åbne positioner ──────────────────────────────
            // Struktur (strategi, retning, antal, købstid, entry, total købspris)
            // kommer fra journalen (open.positions). KUN aktuel pris + urealiseret
            // P&L flettes ind fra snapshot — det eneste live-tal journalen ikke har.
            const snapByTicker = {};
            if (hasSnap && snap.positions) {
                for (const sp of snap.positions) {
                    if (sp.ticker) snapByTicker[sp.ticker.toUpperCase()] = sp;
                }
            }
            const journalOpen = (open && open.positions) ? open.positions : [];
            const sortedOpen = [...journalOpen].sort((a, b) =>
                (b.entry_time_et || "").localeCompare(a.entry_time_et || ""));

            const positionCards = sortedOpen.length === 0
                ? `<div class="empty" style="padding:16px; font-size:13px;">Ingen åbne positioner</div>`
                : sortedOpen.map(p => {
                    const sym       = (p.symbol || "").toUpperCase();
                    const live      = snapByTicker[sym] || null;
                    const lastPrice = live && live.last_price != null ? live.last_price : null;
                    const unrPnl    = live && live.pnl     != null ? live.pnl     : null;
                    const unrPct    = live && live.pnl_pct != null ? live.pnl_pct : null;
                    const totalCost = (p.entry_price != null && p.shares != null)
                        ? p.entry_price * p.shares : null;

                    const pnlClass = unrPnl == null ? "muted"
                                   : unrPnl > 0 ? "positive"
                                   : unrPnl < 0 ? "negative" : "muted";
                    const cardClass = unrPnl == null ? ""
                                    : unrPnl > 0 ? "win"
                                    : unrPnl < 0 ? "loss" : "";
                    const entryTime = p.entry_time_et
                        ? p.entry_time_et.substring(11, 16) + " ET" : "—";
                    const pctText = unrPct != null
                        ? `${unrPct >= 0 ? "+" : ""}${unrPct.toFixed(2)}%` : "—";

                    return `
                        <div class="mobile-pos-card ${cardClass}">
                            <div class="mobile-pos-left">
                                <div class="mobile-pos-tickerline">
                                    <span class="mobile-pos-ticker">${sym}</span>
                                    ${sourcePill(p.source)}
                                    ${sidePill(p.side)}
                                </div>
                                <div class="mobile-pos-meta">${entryTime} · ${p.shares} stk · ${totalCost != null ? fmtMoney(totalCost) : "—"}</div>
                                <div class="mobile-pos-prices">
                                    <span>Køb ${p.entry_price != null ? fmtMoney(p.entry_price) : "—"}</span>
                                    <span class="mobile-pos-last">Nu ${lastPrice != null ? fmtMoney(lastPrice) : "—"}</span>
                                </div>
                            </div>
                            <div class="mobile-pos-right">
                                <div class="mobile-pos-pnl ${pnlClass}">${unrPnl != null ? fmtMoneySigned(unrPnl) : "—"}</div>
                                <div class="mobile-pos-pct ${pnlClass}">${pctText}</div>
                            </div>
                        </div>
                    `;
                }).join("");

            // ── Seneste handler ──────────────────────────────
            // Alle felter fra journalen. Sorteret nyest SOLGTE først.
            const closedSorted = [...closedTrades].sort((a, b) =>
                (b.exit_time_et || "").localeCompare(a.exit_time_et || ""));
            const recent = closedSorted.slice(0, 8);

            const tradeCards = recent.length === 0
                ? `<div class="empty" style="padding:16px; font-size:13px;">Ingen lukkede handler i dag</div>`
                : recent.map(t => {
                    const pnlClass = t.pnl > 0 ? "positive"
                                   : t.pnl < 0 ? "negative" : "muted";
                    const cardClass = t.pnl > 0 ? "win"
                                    : t.pnl < 0 ? "loss" : "";
                    const entryTime = t.entry_time_et
                        ? t.entry_time_et.substring(11, 16) : "—";
                    const exitTime  = t.exit_time_et
                        ? t.exit_time_et.substring(11, 16) + " ET" : "—";
                    const pctText = t.pnl_pct != null
                        ? `${t.pnl_pct >= 0 ? "+" : ""}${t.pnl_pct.toFixed(2)}%` : "—";

                    return `
                        <div class="mobile-trade-card ${cardClass}">
                            <div class="mobile-trade-left">
                                <div class="mobile-pos-tickerline">
                                    <span class="mobile-trade-ticker">${t.symbol}</span>
                                    ${sourcePill(t.source)}
                                    ${sidePill(t.side)}
                                </div>
                                <div class="mobile-trade-time">${entryTime} → ${exitTime} · ${t.shares} stk</div>
                                <div class="mobile-pos-prices">
                                    <span>Køb ${fmtMoney(t.entry_price)}</span>
                                    <span class="mobile-pos-sell">Salg ${t.exit_price != null ? fmtMoney(t.exit_price) : "—"}</span>
                                </div>
                            </div>
                            <div class="mobile-trade-right">
                                <div class="mobile-trade-pnl ${pnlClass}">${fmtMoneySigned(t.pnl)}</div>
                                <div class="mobile-trade-pct ${pnlClass}">${pctText}</div>
                            </div>
                        </div>
                    `;
                }).join("");

            return `
                <div class="mobile-only">
                    <div class="section-title">${dateLabel}</div>

                    <div class="card" style="padding:12px;">
                        <div class="mobile-hero-grid">
                            <div class="mobile-hero-block">
                                <div class="mobile-hero-label">Realiseret</div>
                                <div class="mobile-hero-value ${realClass}">${fmtMoneySigned(totalPnl)}</div>
                                <div class="mobile-hero-meta">${realMeta}</div>
                            </div>
                            <div class="mobile-hero-block">
                                <div class="mobile-hero-label">Urealiseret</div>
                                <div class="mobile-hero-value ${unrClass}">${unrText}</div>
                                <div class="mobile-hero-meta">${unrMeta}</div>
                            </div>
                        </div>
                    </div>

                    <div class="section-title">Åbne positioner (${sortedOpen.length})</div>
                    <div class="mobile-pos-list">
                        ${positionCards}
                    </div>

                    <div class="section-title" style="margin-top:18px;">Seneste handler</div>
                    <div class="mobile-pos-list">
                        ${tradeCards}
                    </div>

                    <div style="text-align:center; color:#888; font-size:13px; margin-top:18px;">
                        Auto-opdaterer hver 10s · <a href="javascript:loadOversigtData()" style="color:#5ab0ff;">Opdater nu</a>
                    </div>
                </div>
            `;
        }

        // ─────────────────────────────────────────────────────
        // JOURNAL-SIDE — historisk gennemgang af alle trades
        // ─────────────────────────────────────────────────────
        // State for filtre og paginering
        const JOURNAL_PAGE_SIZE = 25;
        let journalFilters = null;  // initialiseres ved første load
        let journalPage = 0;
        let journalData = null;     // cache af seneste respons

        function initJournalFilters() {
            // Default: sidste 7 dage, alt valgt
            const today = new Date();
            const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            const toISODate = d => d.toISOString().substring(0, 10);
            return {
                date_from: toISODate(sevenDaysAgo),
                date_to: toISODate(today),
                source: "",      // tom = alle
                symbol: "",      // tom = alle
                status: "all",   // all | open | closed
            };
        }

        async function showJournal() {
            if (!journalFilters) {
                journalFilters = initJournalFilters();
                journalPage = 0;
            }

            // Render skelet med filterbar straks (god UX)
            renderJournalShell();

            // Hent data
            await loadJournalData();

            // Auto-refresh hver 30 sek
            journalTimer = setInterval(() => {
                if (currentPage === "journal") loadJournalData();
            }, 30_000);
        }

        function renderJournalShell() {
            // Render hele siden inkl. filterbar — tabellen bliver indsat senere
            const f = journalFilters;
            const sourceOptions = [
                ["",              "Alle strategier"],
                ["Momentum ORB",  "Momentum ORB"],
                ["Konfluens",     "Konfluens"],
                ["manual",        "Manuel"],
            ].map(([val, label]) => `
                <option value="${val}" ${val === f.source ? "selected" : ""}>${label}</option>
            `).join("");

            const statusOptions = [
                ["all",    "Alle"],
                ["closed", "Lukkede"],
                ["open",   "Åbne"],
            ].map(([val, label]) => `
                <option value="${val}" ${val === f.status ? "selected" : ""}>${label}</option>
            `).join("");

            document.getElementById("content").innerHTML = `
                <div class="section-title">Journal — historisk gennemgang</div>

                <div class="card journal-filterbar">
                    <div class="filter-grid">
                        <div class="filter-field">
                            <label for="f-date-from">Fra dato</label>
                            <input type="date" id="f-date-from" value="${f.date_from}">
                        </div>
                        <div class="filter-field">
                            <label for="f-date-to">Til dato</label>
                            <input type="date" id="f-date-to" value="${f.date_to}">
                        </div>
                        <div class="filter-field">
                            <label for="f-source">Strategi</label>
                            <select id="f-source">${sourceOptions}</select>
                        </div>
                        <div class="filter-field">
                            <label for="f-symbol">Symbol</label>
                            <input type="text" id="f-symbol" maxlength="8"
                                   placeholder="fx CLOV" value="${f.symbol}"
                                   style="text-transform:uppercase;">
                        </div>
                        <div class="filter-field">
                            <label for="f-status">Status</label>
                            <select id="f-status">${statusOptions}</select>
                        </div>
                        <div class="filter-field filter-actions">
                            <button id="f-apply" class="btn-primary">Anvend filtre</button>
                            <button id="f-reset" class="btn-secondary">Nulstil</button>
                        </div>
                    </div>
                </div>

                <div id="journal-results">
                    <div class="card">
                        <div class="empty">Henter handler...</div>
                    </div>
                </div>
            `;

            // Tilkobl event-handlers
            document.getElementById("f-apply").addEventListener("click", applyJournalFilters);
            document.getElementById("f-reset").addEventListener("click", resetJournalFilters);

            // Enter-tasten i felter = anvend
            ["f-date-from", "f-date-to", "f-symbol"].forEach(id => {
                document.getElementById(id).addEventListener("keypress", e => {
                    if (e.key === "Enter") applyJournalFilters();
                });
            });

            // Dropdown-ændring = anvend straks
            ["f-source", "f-status"].forEach(id => {
                document.getElementById(id).addEventListener("change", applyJournalFilters);
            });
        }

        function applyJournalFilters() {
            journalFilters = {
                date_from: document.getElementById("f-date-from").value,
                date_to:   document.getElementById("f-date-to").value,
                source:    document.getElementById("f-source").value,
                symbol:    document.getElementById("f-symbol").value.toUpperCase().trim(),
                status:    document.getElementById("f-status").value,
            };
            journalPage = 0;  // reset til side 1 når filtre ændres
            loadJournalData();
        }

        function resetJournalFilters() {
            journalFilters = initJournalFilters();
            journalPage = 0;
            renderJournalShell();
            loadJournalData();
        }

        async function loadJournalData() {
            const f = journalFilters;
            const params = new URLSearchParams();
            if (f.date_from) params.set("date_from", f.date_from);
            if (f.date_to)   params.set("date_to",   f.date_to);
            if (f.source)    params.set("source",    f.source);
            if (f.symbol)    params.set("symbol",    f.symbol);
            if (f.status && f.status !== "all") params.set("status", f.status);
            params.set("limit",  JOURNAL_PAGE_SIZE);
            params.set("offset", journalPage * JOURNAL_PAGE_SIZE);

            try {
                const res = await authFetch(`/journal/trades?${params.toString()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                journalData = await res.json();
                renderJournalResults();
            } catch (e) {
                document.getElementById("journal-results").innerHTML = `
                    <div class="card">
                        <div class="error"><strong>Fejl:</strong> ${e.message}</div>
                    </div>
                `;
            }
        }

        function renderJournalResults() {
            const data = journalData;
            const trades = data.trades || [];
            // Backenden returnerer "count" (ikke "total") — accepter begge for robusthed
            const total = data.total ?? data.count ?? 0;
            const totalPages = Math.max(1, Math.ceil(total / JOURNAL_PAGE_SIZE));

            // ── Helper-funktioner (genbrug fra Oversigt) ─────
            const sourcePill = (source) => {
                if (source === "Momentum ORB") return `<span class="pill pill-orb">ORB</span>`;
                if (source === "Konfluens")    return `<span class="pill pill-konfl">Konfluens</span>`;
                if (source === "Konfluens 2")  return `<span class="pill pill-konfl2">Konfluens 2</span>`;
                if (source === "manual")       return `<span class="pill pill-manuel">Manuel</span>`;
                return `<span class="pill" style="background:#333;color:#aaa;">${source}</span>`;
            };
            const sidePill = (side) => side === "long"
                ? `<span class="pill pill-long">Long</span>`
                : `<span class="pill pill-short">Short</span>`;
            const reasonPill = (reason) => {
                if (!reason) return "";
                const cls = ["target","trail","stop","force_close","manual"].includes(reason)
                    ? `pill-reason-${reason}` : "";
                return `<span class="pill ${cls}" style="margin-left:6px;font-size:11px;">${reason}</span>`;
            };

            // ── Beregn summary fra de viste trades ───────────
            // (Bemærk: dette er kun for de viste 25 trades, ikke totalt over hele resultat-sættet)
            const closedTrades = trades.filter(t => t.pnl != null);
            const totalPnl = closedTrades.reduce((sum, t) => sum + (t.pnl || 0), 0);
            const wins = closedTrades.filter(t => t.pnl > 0).length;
            const losses = closedTrades.filter(t => t.pnl < 0).length;
            const winRate = closedTrades.length > 0 ? (wins / closedTrades.length * 100) : 0;
            const openCount = trades.filter(t => t.pnl == null && t.exit_time_et == null).length;

            // ── Rækker ───────────────────────────────────────
            const rows = trades.length === 0
                ? `<tr><td colspan="9" class="empty">Ingen handler matcher filtrene</td></tr>`
                : trades.map(t => {
                    const date = t.entry_time_et
                        ? t.entry_time_et.substring(0, 10)
                        : "—";
                    const entryTime = t.entry_time_et
                        ? t.entry_time_et.substring(11, 16) + " ET"
                        : "—";
                    const exitTime = t.exit_time_et
                        ? t.exit_time_et.substring(11, 16) + " ET"
                        : `<span class="open-indicator">Åben</span>`;
                    const exitCell = t.exit_price != null ? fmtMoney(t.exit_price) : "—";
                    const pnlCell = t.pnl != null
                        ? `<span class="${cls(t.pnl)}" style="font-weight:700;">${fmtMoneySigned(t.pnl)}</span>`
                        : `<span class="muted">—</span>`;
                    const rowClass = t.pnl == null ? "row-open"
                                   : t.pnl > 0    ? "row-positive"
                                   : t.pnl < 0    ? "row-negative" : "";
                    return `
                        <tr class="${rowClass} clickable-row" onclick="openTradeDetail('${t.trade_id}')">
                            <td>${date}</td>
                            <td>${entryTime}</td>
                            <td>${exitTime}</td>
                            <td><strong style="font-size:16px;">${t.symbol}</strong> ${sourcePill(t.source)}</td>
                            <td>${sidePill(t.side)}</td>
                            <td class="num">${t.shares}</td>
                            <td class="num">${fmtMoney(t.entry_price)}</td>
                            <td class="num">${exitCell}</td>
                            <td class="num">${pnlCell}${reasonPill(t.exit_reason)}</td>
                        </tr>
                    `;
                }).join("");

            // ── Paginerings-knapper ──────────────────────────
            const fromIdx = total === 0 ? 0 : (journalPage * JOURNAL_PAGE_SIZE) + 1;
            const toIdx = Math.min((journalPage + 1) * JOURNAL_PAGE_SIZE, total);
            const prevDisabled = journalPage === 0 ? "disabled" : "";
            const nextDisabled = (journalPage + 1) >= totalPages ? "disabled" : "";

            document.getElementById("journal-results").innerHTML = `
                <div class="card journal-summary">
                    <div class="journal-summary-grid">
                        <div>
                            <div class="stat-label">I alt fundet</div>
                            <div class="stat-value">${total}</div>
                        </div>
                        <div>
                            <div class="stat-label">Viser side</div>
                            <div class="stat-value">${journalPage + 1} / ${totalPages}
                                <span style="font-size:13px;color:#a0a0a0;font-weight:400;margin-left:8px;">
                                    (${fromIdx}–${toIdx})
                                </span>
                            </div>
                        </div>
                        <div>
                            <div class="stat-label">P&L (denne side)</div>
                            <div class="stat-value ${cls(totalPnl)}">${closedTrades.length > 0 ? fmtMoneySigned(totalPnl) : "—"}</div>
                        </div>
                        <div>
                            <div class="stat-label">Win rate (denne side)</div>
                            <div class="stat-value ${winRate >= 50 ? 'positive' : (closedTrades.length > 0 ? 'negative' : 'muted')}">${closedTrades.length > 0 ? winRate.toFixed(1) + "%" : "—"}</div>
                        </div>
                    </div>
                </div>

                <div class="card" style="padding:0;">
                    <table>
                        <thead>
                            <tr>
                                <th>Dato</th>
                                <th>Entry-tid</th>
                                <th>Exit-tid</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th style="text-align:right;">Stk</th>
                                <th style="text-align:right;">Entry-pris</th>
                                <th style="text-align:right;">Exit-pris</th>
                                <th style="text-align:right;">P&L</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>

                <div class="journal-pagination">
                    <button onclick="goToJournalPage(0)" ${prevDisabled}>« Første</button>
                    <button onclick="goToJournalPage(${journalPage - 1})" ${prevDisabled}>‹ Forrige</button>
                    <span class="page-info">Side ${journalPage + 1} af ${totalPages}</span>
                    <button onclick="goToJournalPage(${journalPage + 1})" ${nextDisabled}>Næste ›</button>
                    <button onclick="goToJournalPage(${totalPages - 1})" ${nextDisabled}>Sidste »</button>
                </div>
            `;
        }

        function goToJournalPage(page) {
            const data = journalData;
            if (!data) return;
            const totalPages = Math.max(1, Math.ceil((data.total || 0) / JOURNAL_PAGE_SIZE));
            if (page < 0 || page >= totalPages) return;
            journalPage = page;
            loadJournalData();
        }

        // ─────────────────────────────────────────────────────
        // TRADE DETAIL — modal med fuld info pr. trade
        // ─────────────────────────────────────────────────────
        async function openTradeDetail(tradeId) {
            // Opret overlay straks med loading-tilstand
            const overlay = document.createElement("div");
            overlay.id = "trade-detail-overlay";
            overlay.className = "modal-overlay";
            overlay.onclick = (e) => { if (e.target === overlay) closeTradeDetail(); };
            overlay.innerHTML = `
                <div class="modal-window trade-detail-modal">
                    <div id="trade-detail-body">
                        <div class="empty" style="padding:60px;">Indlæser handel...</div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            document.addEventListener("keydown", handleTradeDetailKeydown);

            // Hent fuld trade-data
            try {
                const res = await authFetch(`/journal/trades/${tradeId}`);
                if (!res.ok) {
                    if (res.status === 404) throw new Error("Handlen findes ikke længere");
                    throw new Error(`HTTP ${res.status}`);
                }
                const trade = await res.json();
                renderTradeDetail(trade);
            } catch (e) {
                document.getElementById("trade-detail-body").innerHTML = `
                    <div class="modal-header">
                        <div class="modal-title" style="color:#ff8a8a;">Fejl</div>
                        <button class="modal-close-btn" onclick="closeTradeDetail()">✕ Luk</button>
                    </div>
                    <div class="modal-content">
                        <div class="error">${e.message}</div>
                    </div>
                `;
            }
        }

        function closeTradeDetail() {
            const overlay = document.getElementById("trade-detail-overlay");
            if (overlay) overlay.remove();
            document.removeEventListener("keydown", handleTradeDetailKeydown);
        }

        function handleTradeDetailKeydown(e) {
            if (e.key === "Escape") closeTradeDetail();
        }

        function renderTradeDetail(trade) {
            // ── Helpers (gentaget her for at modalen er self-contained) ──
            const sourceBadge = (src) => {
                if (src === "Momentum ORB") return `<span class="pill pill-orb">Momentum ORB</span>`;
                if (src === "Konfluens")    return `<span class="pill pill-konfl">Konfluens</span>`;
                if (src === "Konfluens 2")  return `<span class="pill pill-konfl2">Konfluens 2</span>`;
                if (src === "manual")       return `<span class="pill pill-manuel">Manuel</span>`;
                return `<span class="pill" style="background:#333;color:#aaa;">${src}</span>`;
            };
            const sideBadge = (side) => side === "long"
                ? `<span class="pill pill-long">Long</span>`
                : `<span class="pill pill-short">Short</span>`;

            // ── Dato + tider ─────────────────────────────────
            const dateStr = trade.entry_time_et
                ? trade.entry_time_et.substring(0, 10)
                : "—";
            const entryTimeET = trade.entry_time_et
                ? trade.entry_time_et.substring(11, 16) + " ET"
                : "—";
            const exitTimeET = trade.exit_time_et
                ? trade.exit_time_et.substring(11, 16) + " ET"
                : `<span class="open-indicator">Åben</span>`;

            // Dansk tid — beregn fra UTC
            const danskTime = (utcIso) => {
                if (!utcIso) return null;
                const d = new Date(utcIso);
                return d.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
            };
            const entryTimeDansk = danskTime(trade.entry_time_utc);
            const exitTimeDansk  = danskTime(trade.exit_time_utc);

            // ── Varighed ─────────────────────────────────────
            const durationStr = trade.duration_sec != null
                ? `${Math.floor(trade.duration_sec / 60)} min ${trade.duration_sec % 60} sek`
                : "—";

            // ── P&L formatting ───────────────────────────────
            const pnlText = trade.pnl != null
                ? fmtMoneySigned(trade.pnl)
                : "—";
            const pnlPctText = trade.pnl_pct != null
                ? ` (${trade.pnl_pct >= 0 ? "+" : ""}${trade.pnl_pct.toFixed(2)}%)`
                : "";
            const pnlClass = cls(trade.pnl);

            // ── Status-indikator i header ────────────────────
            const isOpen = trade.exit_time_et == null;
            const statusIndicator = isOpen
                ? `<span class="open-indicator" style="margin-left:auto;">Position åben</span>`
                : trade.pnl > 0
                    ? `<span style="margin-left:auto; color:#5ee99a; font-weight:700;">✓ Lukket med gevinst</span>`
                    : trade.pnl < 0
                        ? `<span style="margin-left:auto; color:#ff8a8a; font-weight:700;">✗ Lukket med tab</span>`
                        : `<span style="margin-left:auto; color:#a0a0a0;">Lukket</span>`;

            // ── Payload — formatteret JSON ───────────────────
            const payloadJson = trade.payload && Object.keys(trade.payload).length > 0
                ? JSON.stringify(trade.payload, null, 2)
                : "(intet payload data)";

            // ── Saml alt ─────────────────────────────────────
            document.getElementById("trade-detail-body").innerHTML = `
                <div class="modal-header">
                    <div class="modal-title">
                        <span style="font-size:24px;color:#ffffff;font-weight:800;">${trade.symbol}</span>
                        <span style="margin-left:12px;">${sourceBadge(trade.source)}</span>
                        <span style="margin-left:6px;">${sideBadge(trade.side)}</span>
                    </div>
                    <button class="modal-close-btn" onclick="closeTradeDetail()" title="Luk (ESC)">✕ Luk</button>
                </div>

                <div class="modal-content">
                    <!-- Sub-header: dato, shares, P&L -->
                    <div class="trade-subheader">
                        <span><strong>${dateStr}</strong></span>
                        <span class="trade-subheader-divider">·</span>
                        <span>${trade.shares} stk</span>
                        ${trade.pnl != null ? `
                            <span class="trade-subheader-divider">·</span>
                            <span class="${pnlClass}" style="font-weight:700;font-size:18px;">
                                ${pnlText}${pnlPctText}
                            </span>
                        ` : ""}
                        ${statusIndicator}
                    </div>

                    <!-- ENTRY-sektion -->
                    <div class="detail-section">
                        <div class="detail-section-title">Entry</div>
                        <div class="detail-grid">
                            <div class="detail-row">
                                <div class="detail-label">Tid</div>
                                <div class="detail-value">${entryTimeET}${entryTimeDansk ? ` <span class="muted-text">(${entryTimeDansk} dansk)</span>` : ""}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Pris</div>
                                <div class="detail-value">${fmtMoney(trade.entry_price)}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Stop</div>
                                <div class="detail-value">${trade.current_stop != null ? fmtMoney(trade.current_stop) : "—"}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Target</div>
                                <div class="detail-value">${trade.current_target != null ? fmtMoney(trade.current_target) : "—"}</div>
                            </div>
                            ${trade.entry_reason ? `
                                <div class="detail-row detail-row-full">
                                    <div class="detail-label">Entry-grund</div>
                                    <div class="detail-value">${trade.entry_reason}</div>
                                </div>
                            ` : ""}
                        </div>
                    </div>

                    <!-- EXIT-sektion -->
                    <div class="detail-section">
                        <div class="detail-section-title">Exit</div>
                        ${isOpen ? `
                            <div class="empty" style="padding:20px;">
                                <span class="open-indicator">Positionen er stadig åben</span>
                            </div>
                        ` : `
                            <div class="detail-grid">
                                <div class="detail-row">
                                    <div class="detail-label">Tid</div>
                                    <div class="detail-value">${exitTimeET}${exitTimeDansk ? ` <span class="muted-text">(${exitTimeDansk} dansk)</span>` : ""}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Pris</div>
                                    <div class="detail-value">${fmtMoney(trade.exit_price)}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Grund</div>
                                    <div class="detail-value">${trade.exit_reason || "—"}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Varighed</div>
                                    <div class="detail-value">${durationStr}</div>
                                </div>
                            </div>
                        `}
                    </div>

                    <!-- P&L-sektion -->
                    ${trade.pnl != null ? `
                        <div class="detail-section">
                            <div class="detail-section-title">Resultat</div>
                            <div class="detail-grid">
                                <div class="detail-row">
                                    <div class="detail-label">Realiseret P&L</div>
                                    <div class="detail-value ${pnlClass}" style="font-size:18px;font-weight:700;">${pnlText}${pnlPctText}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Kapital brugt</div>
                                    <div class="detail-value">${trade.capital_used != null ? fmtMoney(trade.capital_used) : "—"}</div>
                                </div>
                            </div>
                        </div>
                    ` : ""}

                    <!-- NOTES-sektion -->
                    <div class="detail-section">
                        <div class="detail-section-title-row">
                            <span class="detail-section-title-text">Notes</span>
                            <button id="notes-edit-btn" class="notes-edit-btn"
                                    onclick="enterNotesEdit('${trade.trade_id}')">
                                ✏ Rediger
                            </button>
                        </div>
                        <div id="notes-display" class="detail-notes-readonly">
                            ${trade.notes
                                ? trade.notes.replace(/</g, "&lt;").replace(/>/g, "&gt;")
                                : "<span class='muted-text'>Ingen notes endnu — klik Rediger for at tilføje</span>"}
                        </div>
                        <div id="notes-edit" class="notes-edit-wrapper" style="display:none;">
                            <textarea id="notes-textarea" class="notes-textarea"
                                      placeholder="Tilføj læring, observationer eller kontekst om denne handel...">${
                                trade.notes ? trade.notes.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""
                            }</textarea>
                            <div id="notes-edit-error" class="notes-edit-error"></div>
                            <div class="notes-edit-actions">
                                <button class="btn-primary notes-save-btn"
                                        onclick="saveNotes('${trade.trade_id}')">💾 Gem</button>
                                <button class="btn-secondary"
                                        onclick="cancelNotesEdit()">Annuller</button>
                            </div>
                        </div>
                    </div>

                    <!-- FORENSICS-sektion (collapsed accordion) -->
                    <details class="detail-forensics">
                        <summary>
                            <span>▶ Forensics — rå data (klik for at se)</span>
                        </summary>
                        <pre class="detail-payload">${payloadJson.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>
                    </details>

                    <!-- META-info nederst -->
                    <div class="detail-meta">
                        Trade ID: <code>${trade.trade_id}</code><br>
                        Konto: ${trade.account_id} · Instans: ${trade.instance_id} · IBKR: ${trade.ibkr_account}
                        ${trade.variant ? ` · Variant: ${trade.variant}` : ""}
                    </div>
                </div>
            `;
        }

        // ─── Notes-redigering ─────────────────────────────────
        function enterNotesEdit(tradeId) {
            document.getElementById("notes-display").style.display = "none";
            document.getElementById("notes-edit-btn").style.display = "none";
            document.getElementById("notes-edit").style.display = "block";
            const textarea = document.getElementById("notes-textarea");
            textarea.focus();
            // Placer cursor i slutningen af eksisterende tekst
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        }

        function cancelNotesEdit() {
            document.getElementById("notes-edit").style.display = "none";
            document.getElementById("notes-display").style.display = "block";
            document.getElementById("notes-edit-btn").style.display = "inline-block";
            document.getElementById("notes-edit-error").textContent = "";
        }

        async function saveNotes(tradeId) {
            const textarea = document.getElementById("notes-textarea");
            const errorDiv = document.getElementById("notes-edit-error");
            const saveBtn = document.querySelector(".notes-save-btn");

            const newNotes = textarea.value.trim();

            // UI feedback under save
            saveBtn.disabled = true;
            saveBtn.textContent = "Gemmer...";
            errorDiv.textContent = "";

            try {
                const res = await authFetch(`/journal/trades/${tradeId}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ notes: newNotes }),
                });

                if (!res.ok) {
                    if (res.status === 404) throw new Error("Handlen findes ikke længere");
                    throw new Error(`HTTP ${res.status}`);
                }

                // Success: opdater display med ny tekst og gå tilbage til view-mode
                const displayDiv = document.getElementById("notes-display");
                if (newNotes) {
                    displayDiv.innerHTML = newNotes
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;");
                } else {
                    displayDiv.innerHTML = "<span class='muted-text'>Ingen notes endnu — klik Rediger for at tilføje</span>";
                }

                // Skift tilbage til view-mode
                document.getElementById("notes-edit").style.display = "none";
                document.getElementById("notes-display").style.display = "block";
                document.getElementById("notes-edit-btn").style.display = "inline-block";

                // Refresh underliggende journal-data så tabellen er konsistent
                // (silent — fejler ikke modal-flowet hvis tabel-refresh fejler)
                loadJournalData().catch(() => {});
            } catch (e) {
                errorDiv.textContent = `Kunne ikke gemme: ${e.message}`;
                saveBtn.disabled = false;
                saveBtn.textContent = "💾 Gem";
            }
        }

        // ─────────────────────────────────────────────────────
        // KONTO-SIDE
        // ─────────────────────────────────────────────────────
        async function showAccount() {
            await loadSnapshot();
            accountTimer = setInterval(() => {
                if (currentPage === "account") loadSnapshot(false);
            }, 10_000);
        }

        async function loadSnapshot(forceJournal = false) {
            const url = "/account/snapshot" + (forceJournal ? "?force_journal=true" : "");
            try {
                const res = await authFetch(url);
                const data = await res.json();
                if (!data.ok) {
                    renderAccountError(data.error || "Ukendt fejl");
                    return;
                }
                renderAccount(data);
            } catch (e) {
                renderAccountError("Backend ikke tilgængelig: " + e.message);
            }
        }

        function renderAccountError(msg) {
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="error"><strong>Fejl:</strong> ${msg}</div>
                    <div class="controls">
                        <span></span>
                        <button onclick="loadSnapshot(true)">↻ Prøv igen</button>
                    </div>
                </div>
            `;
        }

        function renderAccount(data) {
            const badge = data.paper_trading
                ? '<span class="badge paper">Paper</span>'
                : '<span class="badge live">LIVE</span>';

            const positionRows = data.positions.length === 0
                ? `<tr><td colspan="6" class="empty">Ingen åbne positioner</td></tr>`
                : data.positions.map(p => {
                    const side = p.position > 0 ? "Long" : (p.position < 0 ? "Short" : "—");
                    return `
                        <tr>
                            <td><strong>${p.ticker}</strong></td>
                            <td>${side}</td>
                            <td class="num">${Math.abs(p.position)}</td>
                            <td class="num">${fmtMoney(p.avg_cost)}</td>
                            <td class="num">${fmtMoney(p.last_price)}</td>
                            <td class="num ${cls(p.pnl)}">
                                ${fmtMoneySigned(p.pnl)}
                                ${p.pnl_pct !== null ? `(${fmtPct(p.pnl_pct)})` : ""}
                            </td>
                        </tr>
                    `;
                }).join("");

            document.getElementById("content").innerHTML = `
                <div class="section-title">Konto ${badge}</div>
                <div class="card">
                    <div style="font-size:14px;color:#888;margin-bottom:20px;">
                        IBKR konto: <code>${data.ibkr_account}</code>
                    </div>
                    <div class="stats-grid">
                        <div>
                            <div class="stat-label">Net Liquidation Value</div>
                            <div class="stat-value">${fmtMoney(data.net_liquidation)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Cash</div>
                            <div class="stat-value">${fmtMoney(data.cash_balance)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Urealiseret P&L</div>
                            <div class="stat-value ${cls(data.unrealized_pnl)}">${fmtMoneySigned(data.unrealized_pnl)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Realiseret P&L</div>
                            <div class="stat-value ${cls(data.realized_pnl)}">${fmtMoneySigned(data.realized_pnl)}</div>
                        </div>
                    </div>
                </div>

                <div class="section-title">Åbne positioner (${data.positions.length})</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead>
                            <tr>
                                <th>Symbol</th><th>Side</th>
                                <th style="text-align:right;">Stk</th>
                                <th style="text-align:right;">Entry</th>
                                <th style="text-align:right;">Nu</th>
                                <th style="text-align:right;">P&L</th>
                            </tr>
                        </thead>
                        <tbody>${positionRows}</tbody>
                    </table>
                </div>

                <div class="controls">
                    <span>Sidst opdateret: ${fmtTime(data.checked_at)} (auto-refresh hver 10s)</span>

        };

            document.body.appendChild(overlay);

            // ESC for at lukke
            document.addEventListener("keydown", handleDocsKeydown);

            // Hent indhold
            try {
                const res = await authFetch(`/strategies/${strategy}/docs/${version}`);

        // ─────────────────────────────────────────────────────

        async function showAnalysis() {
            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">

        async function loadAnalysisData() {
            const body = document.getElementById("analysis-body");
            if (!body) return;

            // Hent peers-listen (lokalt — kender ikke andre maskiner endnu)
            if (!analysisPeers) {
                try {
                    const res = await fetch("/peers");
                    const data = await res.json();
                    analysisPeers = (data.peers || []).filter(p => p.enabled);
                } catch (e) {
                    body.innerHTML = `<div class="error">Kunne ikke hente peers: ${e.message}</div>`;
                    return;
                }
            }

            if (analysisPeers.length === 0) {
                body.innerHTML = `<div class="empty">Ingen aktive maskiner i peers.json</div>`;
                return;
            }

            // Vis loading-tilstand med peers-navne
            body.innerHTML = `
                <div class="empty">
                    Kontakter ${analysisPeers.length} maskiner...<br>
                    <span style="font-size:11px; color:#666;">${analysisPeers.map(p => p.name).join(" · ")}</span>
                </div>
            `;

            // Kald alle peers parallelt — 4 sek timeout per maskine
            const results = await Promise.all(
                analysisPeers.map(p => fetchPeerData(p))
            );

            renderAnalysisTable(results);
        }

        async function fetchPeerData(peer) {
            const result = {
                peer: peer,
                online: false,
                health: null,
                account: null,
                error: null,
            };

            // Hent /health (ingen auth nødvendig)
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                const res = await fetch(`${peer.url}/health`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.ok) {
                    result.health = await res.json();
                    result.online = true;
                } else {
                    result.error = `HTTP ${res.status}`;
                }
            } catch (e) {
                result.error = e.name === "AbortError" ? "Timeout" : "Offline";
                return result;
            }

            // Hent /account/snapshot (kræver auth — kun hvis online og IBKR forbundet)
            // Note: vi har ikke token til REMOTE backends endnu — det kommer senere
            // For nu viser vi kun de data /health giver os
            return result;
        }

            const body = document.getElementById("analysis-body");

            const rows = results.map(r => {

                    return `
                        <tr>

                const h = r.health;

                const algo = h.algo_running ? "▶ Kører" : "—";

                return `
                    <tr>
                        <td><strong>${r.peer.name}</strong><br><span style="font-size:11px; color:#666;">${r.peer.host}</span></td>
                        <td><span class="status-dot online"></span> Online</td>
                        <td>${ibkr}</td>
                        <td>${algo}</td>
                        <td>${h.clients ?? "—"}</td>
                        <td>${h.journal_events ?? "—"}</td>

            body.innerHTML = `
