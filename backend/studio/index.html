<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dash Studio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #2a2a2a;
            padding: 16px 24px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .identity {
            font-size: 13px;
            color: #aaa;
        }

        nav {
            background: #252525;
            padding: 0 24px;
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #444;
        }

        nav button {
            background: none;
            border: none;
            color: #aaa;
            padding: 12px 16px;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        nav button.active {
            color: #fff;
            border-bottom-color: #4a9eff;
        }

        nav button:hover:not(.active) {
            color: #ddd;
        }

        main {
            flex: 1;
            padding: 32px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 12px;
        }

        .card {
            background: #232323;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stat-value.positive {
            color: #4ade80;
        }

        .stat-value.negative {
            color: #f87171;
        }

        .stat-value.muted {
            color: #888;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        th {
            color: #888;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        td.positive {
            color: #4ade80;
        }

        td.negative {
            color: #f87171;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #333;
            font-size: 13px;
            color: #888;
        }

        .controls button {
            background: #333;
            border: 1px solid #555;
            color: #ddd;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .controls button:hover {
            background: #3a3a3a;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
        }

        .badge.paper {
            background: #4a5568;
            color: #fff;
        }

        .badge.live {
            background: #c05621;
            color: #fff;
        }

        .error {
            background: #4a1a1a;
            border: 1px solid #7a2a2a;
            color: #fca5a5;
            padding: 16px;
            border-radius: 6px;
        }

        .empty {
            color: #666;
            font-style: italic;
            padding: 24px;
            text-align: center;
        }

        code {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
        }

        .period-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
        }

        .period-tabs button {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .period-tabs button.active {
            background: #1a4a8a;
            border-color: #4a9eff;
            color: #fff;
        }

        .period-tabs button:hover:not(.active) {
            background: #333;
        }

        .placeholder-text {
            color: #888;
            text-align: center;
            padding: 48px 24px;
        }

        /* Login overlay */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a1a;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #login-overlay.hidden {
            display: none;
        }

        .login-box {
            background: #232323;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 32px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-box h2 {
            margin: 0 0 24px;
            font-size: 18px;
            font-weight: 600;
        }

        .login-box input {
            width: 100%;
            padding: 12px 14px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #4a9eff;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #5aabff;
        }

        .login-box button:disabled {
            background: #555;
            cursor: wait;
        }

        .login-error {
            color: #f87171;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .status-dot.online  { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.6); }
        .status-dot.offline { background: #666; }

        table th { color: #aaa; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        table td { padding: 12px 8px; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
        table tr:last-child td { border-bottom: none; }
    </style>
    <script src="/studio/dev_config.js" onerror="console.log('[DEV] Ingen dev_config.js — prod mode aktiv')"></script>
</head>

<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2>Trading Dash Studio</h2>
            <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
            <button id="login-button">Log ind</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>
    <header>
        <h1>Trading Dash Studio</h1>
        <div class="identity" id="identity">Indlæser identitet...</div>
    </header>

    <nav id="nav">
        <button data-page="account" class="active">Konto</button>
        <button data-page="strategies">Strategier</button>
        <button data-page="analysis">Analyse</button>
        <button data-page="backtest">Backtest</button>
        <button data-page="log">Log</button>
    </nav>

    <main>
        <div id="content">
            <div class="card">
                <div class="empty">Indlæser...</div>
            </div>
        </div>
    </main>

    <script>
        // ─────────────────────────────────────────────────────
        // Auth — login-overlay og token-lagring
        // ─────────────────────────────────────────────────────
        const TOKEN_KEY = "tdstudio_token";

        function getToken() {
            return localStorage.getItem(TOKEN_KEY);
        }

        function setToken(token) {
            localStorage.setItem(TOKEN_KEY, token);
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_KEY);
        }

        async function authFetch(url, options = {}) {
            const token = getToken();
            const headers = {
                ...(options.headers || {}),
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
            };
            const res = await fetch(url, { ...options, headers });

            // Hvis 401, token er udløbet (backend genstartet) — vis login igen
            if (res.status === 401) {
                clearToken();
                showLogin();
                throw new Error("Session udløbet");
            }
            return res;
        }

        function showLogin() {
            document.getElementById("login-overlay").classList.remove("hidden");
            document.getElementById("login-error").textContent = "";
            document.getElementById("login-password").value = "";
            setTimeout(() => document.getElementById("login-password").focus(), 100);
        }

        function hideLogin() {
            document.getElementById("login-overlay").classList.add("hidden");
        }

        async function attemptLogin() {
            const passwordInput = document.getElementById("login-password");
            const button = document.getElementById("login-button");
            const errorDiv = document.getElementById("login-error");

            const password = passwordInput.value;
            if (!password) {
                errorDiv.textContent = "Indtast password";
                return;
            }

            button.disabled = true;
            button.textContent = "Logger ind...";
            errorDiv.textContent = "";

            try {
                const res = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password }),
                });

                if (!res.ok) {
                    errorDiv.textContent = "Forkert password";
                    return;
                }

                const data = await res.json();
                setToken(data.token);
                hideLogin();
                // Trigger initial side-load nu hvor vi er logget ind
                loadIdentity();
                switchPage(currentPage || "account");
            } catch (e) {
                errorDiv.textContent = "Backend ikke tilgængelig";
            } finally {
                button.disabled = false;
                button.textContent = "Log ind";
            }
        }

        document.getElementById("login-button").addEventListener("click", attemptLogin);
        document.getElementById("login-password").addEventListener("keypress", e => {
            if (e.key === "Enter") attemptLogin();
        });

        async function checkAuthAndStart() {
            // DEV MODE — kun aktivt hvis dev_config.js er loaded
            const devMode = window.DEV_CONFIG?.DEV_MODE === true;
            if (devMode) {
                if (!getToken()) {
                    try {
                        const res = await fetch("/auth/login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ password: window.DEV_CONFIG.DEV_PASSWORD }),
                        });
                        if (res.ok) {
                            const data = await res.json();
                            setToken(data.token);
                        } else {
                            console.error("[DEV] Auto-login fejlede — tjek password");
                        }
                    } catch (e) {
                        console.error("[DEV] Auto-login fejl:", e);
                    }
                }
                hideLogin();
                loadIdentity();
                switchPage("account");
                return;
            }

            // PROD MODE — original auth-flow
            const token = getToken();
            if (!token) {
                showLogin();
                return;
            }
            try {
                const res = await fetch("/auth/check", {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!res.ok) {
                    clearToken();
                    showLogin();
                    return;
                }
                hideLogin();
                loadIdentity();
                switchPage("account");
            } catch (e) {
                showLogin();
            }
        }
        // ─────────────────────────────────────────────────────
        // Formatering
        // ─────────────────────────────────────────────────────
        const fmtMoney = v => {
            if (v === null || v === undefined) return "—";
            const sign = v < 0 ? "-" : "";
            return sign + "$" + Math.abs(v).toLocaleString("da-DK", {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });
        };
        const fmtMoneySigned = v => {
            if (v === null || v === undefined) return "—";
            const sign = v >= 0 ? "+" : "-";
            return sign + "$" + Math.abs(v).toLocaleString("da-DK", {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });
        };
        const fmtPct = v => {
            if (v === null || v === undefined) return "—";
            const sign = v >= 0 ? "+" : "";
            return sign + v.toFixed(2) + "%";
        };
        const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString("da-DK") : "—";
        const fmtDate = iso => iso ? new Date(iso).toLocaleDateString("da-DK") : "—";
        const cls = v => {
            if (v === null || v === undefined || v === 0) return "muted";
            return v > 0 ? "positive" : "negative";
        };

        // ─────────────────────────────────────────────────────
        // Identitet (én gang)
        // ─────────────────────────────────────────────────────
        // ─────────────────────────────────────────────────────
        // Identitet — hentes efter login er bekræftet
        // ─────────────────────────────────────────────────────
        async function loadIdentity() {
            try {
                const res = await authFetch("/account");
                const data = await res.json();
                document.getElementById("identity").textContent =
                    `${data.account_display_name} — ${data.instance_display_name}`;
            } catch (e) {
                document.getElementById("identity").textContent = "Identitet ikke tilgængelig";
            }
        }

        // ─────────────────────────────────────────────────────
        // Router — håndterer side-skift
        // ─────────────────────────────────────────────────────
        let currentPage = "account";
        let accountTimer = null;

        document.getElementById("nav").addEventListener("click", e => {
            const btn = e.target.closest("button[data-page]");
            if (!btn) return;
            const page = btn.dataset.page;
            switchPage(page);
        });

        function switchPage(page) {
            currentPage = page;

            // Opdater tab-styling
            document.querySelectorAll("#nav button").forEach(b => {
                b.classList.toggle("active", b.dataset.page === page);
            });

            // Stop alle timers — ny side starter sine egne hvis nødvendigt
            if (accountTimer) { clearInterval(accountTimer); accountTimer = null; }
            if (strategiesTimer) { clearInterval(strategiesTimer); strategiesTimer = null; }

            // Render
            const content = document.getElementById("content");
            content.innerHTML = `<div class="card"><div class="empty">Indlæser...</div></div>`;

            if (page === "account") showAccount();
            else if (page === "analysis") showAnalysis();
            else if (page === "strategies") showStrategies();
            else showPlaceholder(page);
        }

        function showPlaceholder(page) {
            const labels = {
                backtest: "Backtest",
                log: "Event-log",
            };
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="placeholder-text">
                        <h2 style="color:#aaa">${labels[page] || page}</h2>
                        <p>Bygges i en senere session.</p>
                    </div>
                </div>
            `;
        }

        // ─────────────────────────────────────────────────────
        // KONTO-SIDE
        // ─────────────────────────────────────────────────────
        async function showAccount() {
            await loadSnapshot();
            accountTimer = setInterval(() => {
                if (currentPage === "account") loadSnapshot(false);
            }, 10_000);
        }

        async function loadSnapshot(forceJournal = false) {
            const url = "/account/snapshot" + (forceJournal ? "?force_journal=true" : "");
            try {
                const res = await authFetch(url);
                const data = await res.json();
                if (!data.ok) {
                    renderAccountError(data.error || "Ukendt fejl");
                    return;
                }
                renderAccount(data);
            } catch (e) {
                renderAccountError("Backend ikke tilgængelig: " + e.message);
            }
        }

        function renderAccountError(msg) {
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="error"><strong>Fejl:</strong> ${msg}</div>
                    <div class="controls">
                        <span></span>
                        <button onclick="loadSnapshot(true)">↻ Prøv igen</button>
                    </div>
                </div>
            `;
        }

        function renderAccount(data) {
            const badge = data.paper_trading
                ? '<span class="badge paper">Paper</span>'
                : '<span class="badge live">LIVE</span>';

            const positionRows = data.positions.length === 0
                ? `<tr><td colspan="6" class="empty">Ingen åbne positioner</td></tr>`
                : data.positions.map(p => {
                    const side = p.position > 0 ? "Long" : (p.position < 0 ? "Short" : "—");
                    return `
                        <tr>
                            <td><strong>${p.ticker}</strong></td>
                            <td>${side}</td>
                            <td class="num">${Math.abs(p.position)}</td>
                            <td class="num">${fmtMoney(p.avg_cost)}</td>
                            <td class="num">${fmtMoney(p.last_price)}</td>
                            <td class="num ${cls(p.pnl)}">
                                ${fmtMoneySigned(p.pnl)}
                                ${p.pnl_pct !== null ? `(${fmtPct(p.pnl_pct)})` : ""}
                            </td>
                        </tr>
                    `;
                }).join("");

            document.getElementById("content").innerHTML = `
                <div class="section-title">Konto ${badge}</div>
                <div class="card">
                    <div style="font-size:14px;color:#888;margin-bottom:20px;">
                        IBKR konto: <code>${data.ibkr_account}</code>
                    </div>
                    <div class="stats-grid">
                        <div>
                            <div class="stat-label">Net Liquidation Value</div>
                            <div class="stat-value">${fmtMoney(data.net_liquidation)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Cash</div>
                            <div class="stat-value">${fmtMoney(data.cash_balance)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Urealiseret P&L</div>
                            <div class="stat-value ${cls(data.unrealized_pnl)}">${fmtMoneySigned(data.unrealized_pnl)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Realiseret P&L</div>
                            <div class="stat-value ${cls(data.realized_pnl)}">${fmtMoneySigned(data.realized_pnl)}</div>
                        </div>
                    </div>
                </div>

                <div class="section-title">Åbne positioner (${data.positions.length})</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead>
                            <tr>
                                <th>Symbol</th><th>Side</th>
                                <th style="text-align:right;">Stk</th>
                                <th style="text-align:right;">Entry</th>
                                <th style="text-align:right;">Nu</th>
                                <th style="text-align:right;">P&L</th>
                            </tr>
                        </thead>
                        <tbody>${positionRows}</tbody>
                    </table>
                </div>

                <div class="controls">
                    <span>Sidst opdateret: ${fmtTime(data.checked_at)} (auto-refresh hver 10s)</span>
                    <button onclick="loadSnapshot(true)">↻ Opdater nu</button>
                </div>
            `;
        }

        // ─────────────────────────────────────────────────────
        // STRATEGIER-SIDE
        // ─────────────────────────────────────────────────────
        let strategiesTimer = null;

        async function showStrategies() {
            await loadStrategiesStatus();
            // Poll status hvert 2. sek (algo-start tager ~10-30 sek)
            strategiesTimer = setInterval(() => {
                if (currentPage === "strategies") loadStrategiesStatus();
            }, 2000);
        }

        async function loadStrategiesStatus() {
            try {
                const res = await authFetch("/algo/status");
                const data = await res.json();
                renderStrategies(data);
            } catch (e) {
                renderStrategiesError("Backend ikke tilgængelig: " + e.message);
            }
        }

        function renderStrategiesError(msg) {
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="error"><strong>Fejl:</strong> ${msg}</div>
                </div>
            `;
        }

        function renderStrategies(data) {
            const statusBadge = data.running
                ? '<span class="badge" style="background:#4ade80;color:#000;">KØRER</span>'
                : '<span class="badge" style="background:#444;color:#aaa;">STOPPET</span>';

            const ibkrBadge = data.ibkr_connected
                ? '<span style="color:#4ade80;">● IBKR forbundet</span>'
                : '<span style="color:#f87171;">● IBKR ikke forbundet</span>';

            const stats = data.stats || {};
            const statsHtml = data.running ? `
                <div class="stats-grid" style="margin-top:24px;">
                    <div>
                        <div class="stat-label">Dagens P&L</div>
                        <div class="stat-value ${cls(stats.pnl_today)}">${fmtMoneySigned(stats.pnl_today)}</div>
                    </div>
                    <div>
                        <div class="stat-label">Handler i dag</div>
                        <div class="stat-value">${stats.trades_today || 0}</div>
                    </div>
                    <div>
                        <div class="stat-label">Åbne positioner</div>
                        <div class="stat-value">${stats.open_positions || 0}</div>
                    </div>
                </div>
            ` : "";

            const startDisabled = data.running ? "disabled" : "";
            const stopDisabled = !data.running ? "disabled" : "";

            document.getElementById("content").innerHTML = `
                <div class="section-title">Momentum ORB ${statusBadge}</div>
                <div class="card">
                    <div style="font-size:14px;color:#aaa;margin-bottom:16px;">
                        ${ibkrBadge}
                        <span style="margin:0 12px;color:#444;">·</span>
                        Instans: <code>${data.instance || "ukendt"}</code>
                    </div>
                    <div style="display:flex;gap:12px;">
                        <button id="btn-start" onclick="startAlgo()" ${startDisabled}
                                style="flex:1;padding:14px;background:${data.running ? '#444' : '#4ade80'};
                                       color:${data.running ? '#666' : '#000'};border:none;border-radius:6px;
                                       font-size:14px;font-weight:600;cursor:${data.running ? 'not-allowed' : 'pointer'};">
                            ▶ Start algoritme
                        </button>
                        <button id="btn-stop" onclick="stopAlgo()" ${stopDisabled}
                                style="flex:1;padding:14px;background:${!data.running ? '#444' : '#f87171'};
                                       color:${!data.running ? '#666' : '#000'};border:none;border-radius:6px;
                                       font-size:14px;font-weight:600;cursor:${!data.running ? 'not-allowed' : 'pointer'};">
                            ■ Stop algoritme
                        </button>
                    </div>
                    ${statsHtml}
                </div>
            `;
        }

        async function startAlgo() {
            try {
                const res = await authFetch("/algo/start", { method: "POST" });
                const data = await res.json();
                console.log("Start:", data);
                // Status polles automatisk hvert 2. sek og opdaterer UI
            } catch (e) {
                renderStrategiesError("Kunne ikke starte: " + e.message);
            }
        }

        async function stopAlgo() {
            try {
                const res = await authFetch("/algo/stop", { method: "POST" });
                const data = await res.json();
                console.log("Stop:", data);
            } catch (e) {
                renderStrategiesError("Kunne ikke stoppe: " + e.message);
            }
        }

        // ─────────────────────────────────────────────────────
        // ANALYSE-SIDE
        // ─────────────────────────────────────────────────────
        let analysisPeriod = "all";

        // ─────────────────────────────────────────────────────
        // Analyse — multi-maskine overblik
        // ─────────────────────────────────────────────────────
        let analysisPeers = null;  // cache peers efter første hent

        async function showAnalysis() {
            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                        <h2 style="margin:0; font-size:18px;">Analyse — alle maskiner</h2>
                        <button id="analysis-refresh" style="background:#1a4a8a; border:1px solid #4a9eff; color:#fff; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:13px;">
                            ↻ Opdater
                        </button>
                    </div>
                    <div id="analysis-body">
                        <div class="empty">Henter data...</div>
                    </div>
                </div>
            `;

            document.getElementById("analysis-refresh").addEventListener("click", loadAnalysisData);
            await loadAnalysisData();
        }

        async function loadAnalysisData() {
            const body = document.getElementById("analysis-body");
            if (!body) return;

            // Hent peers-listen (lokalt — kender ikke andre maskiner endnu)
            if (!analysisPeers) {
                try {
                    const res = await fetch("/peers");
                    const data = await res.json();
                    analysisPeers = (data.peers || []).filter(p => p.enabled);
                } catch (e) {
                    body.innerHTML = `<div class="error">Kunne ikke hente peers: ${e.message}</div>`;
                    return;
                }
            }

            if (analysisPeers.length === 0) {
                body.innerHTML = `<div class="empty">Ingen aktive maskiner i peers.json</div>`;
                return;
            }

            // Vis loading-tilstand med peers-navne
            body.innerHTML = `
                <div class="empty">
                    Kontakter ${analysisPeers.length} maskiner...<br>
                    <span style="font-size:11px; color:#666;">${analysisPeers.map(p => p.name).join(" · ")}</span>
                </div>
            `;

            // Kald alle peers parallelt — 4 sek timeout per maskine
            const results = await Promise.all(
                analysisPeers.map(p => fetchPeerData(p))
            );

            renderAnalysisTable(results);
        }

        async function fetchPeerData(peer) {
            const result = {
                peer: peer,
                online: false,
                health: null,
                account: null,
                error: null,
            };

            // Hent /health (ingen auth nødvendig)
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                const res = await fetch(`${peer.url}/health`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.ok) {
                    result.health = await res.json();
                    result.online = true;
                } else {
                    result.error = `HTTP ${res.status}`;
                }
            } catch (e) {
                result.error = e.name === "AbortError" ? "Timeout" : "Offline";
                return result;
            }

            // Hent /account/snapshot (kræver auth — kun hvis online og IBKR forbundet)
            // Note: vi har ikke token til REMOTE backends endnu — det kommer senere
            // For nu viser vi kun de data /health giver os
            return result;
        }

        function renderAnalysisTable(results) {
            const body = document.getElementById("analysis-body");

            const rows = results.map(r => {
                if (!r.online) {
                    return `
                        <tr>
                            <td><strong>${r.peer.name}</strong><br><span style="font-size:11px; color:#666;">${r.peer.host || "—"}</span></td>
                            <td><span class="status-dot offline"></span> ${r.error || "Offline"}</td>
                            <td colspan="5" class="muted">—</td>
                        </tr>
                    `;
                }

                const h = r.health;
                const ibkr = h.ibkr_connected ? "✓" : "—";
                const algo = h.algo_running ? "▶ Kører" : "—";

                return `
                    <tr>
                        <td><strong>${r.peer.name}</strong><br><span style="font-size:11px; color:#666;">${r.peer.host}</span></td>
                        <td><span class="status-dot online"></span> Online</td>
                        <td>${ibkr}</td>
                        <td>${algo}</td>
                        <td>${h.clients ?? "—"}</td>
                        <td>${h.journal_events ?? "—"}</td>
                        <td style="font-size:11px; color:#888;">${h.time ? new Date(h.time).toLocaleTimeString("da-DK") : "—"}</td>
                    </tr>
                `;
            }).join("");

            body.innerHTML = `
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="border-bottom:1px solid #333; text-align:left;">
                            <th style="padding:10px 8px;">Maskine</th>
                            <th style="padding:10px 8px;">Status</th>
                            <th style="padding:10px 8px;">IBKR</th>
                            <th style="padding:10px 8px;">Algo</th>
                            <th style="padding:10px 8px;">Clients</th>
                            <th style="padding:10px 8px;">Journal</th>
                            <th style="padding:10px 8px;">Sidst kontaktet</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>
                <div style="margin-top:16px; font-size:12px; color:#666;">
                    Auth bliver tilføjet senere — viser kun offentlige /health-data for nu.
                </div>
            `;
        }

        async function loadAnalysis() {
            try {
                const res = await authFetch(`/analysis/summary?period=${analysisPeriod}`);
                const data = await res.json();
                if (data.error) {
                    renderAnalysisError(data.error);
                    return;
                }
                renderAnalysis(data);
            } catch (e) {
                renderAnalysisError("Backend ikke tilgængelig: " + e.message);
            }
        }

        function renderAnalysisError(msg) {
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="error"><strong>Fejl:</strong> ${msg}</div>
                </div>
            `;
        }

        function renderAnalysis(data) {
            const periodLabels = {
                today: "I dag",
                "7d": "Sidste 7 dage",
                "30d": "Sidste 30 dage",
                all: "Alt",
            };

            const periodTabs = ["today", "7d", "30d", "all"].map(p => `
                <button class="${p === analysisPeriod ? "active" : ""}"
                        onclick="setPeriod('${p}')">${periodLabels[p]}</button>
            `).join("");

            const k = data.kpis;

            const dailyRows = data.daily_pnl.length === 0
                ? `<tr><td colspan="3" class="empty">Ingen handler i perioden</td></tr>`
                : data.daily_pnl.map(d => `
                    <tr>
                        <td>${fmtDate(d.date)}</td>
                        <td class="num">${d.trades}</td>
                        <td class="num ${cls(d.pnl)}">${fmtMoneySigned(d.pnl)}</td>
                    </tr>
                `).join("");

            const tickerRows = data.per_ticker.length === 0
                ? `<tr><td colspan="5" class="empty">Ingen data</td></tr>`
                : data.per_ticker.map(t => `
                    <tr>
                        <td><strong>${t.symbol}</strong></td>
                        <td class="num">${t.trades}</td>
                        <td class="num">${t.wins}</td>
                        <td class="num">${fmtPct(t.win_rate)}</td>
                        <td class="num ${cls(t.pnl)}">${fmtMoneySigned(t.pnl)}</td>
                    </tr>
                `).join("");

            const tradeRows = data.trades.length === 0
                ? `<tr><td colspan="6" class="empty">Ingen handler</td></tr>`
                : data.trades.map(t => {
                    const time = t.opened_at ? new Date(t.opened_at).toLocaleString("da-DK") : "—";
                    return `
                        <tr>
                            <td>${time}</td>
                            <td><strong>${t.symbol}</strong></td>
                            <td class="num">${t.quantity}</td>
                            <td class="num">${fmtMoney(t.entry_price)}</td>
                            <td class="num">${fmtMoney(t.exit_price)}</td>
                            <td class="num ${cls(t.pnl)}">${fmtMoneySigned(t.pnl)}</td>
                        </tr>
                    `;
                }).join("");

            document.getElementById("content").innerHTML = `
                <div class="period-tabs">${periodTabs}</div>

                <div class="section-title">Nøgletal — ${periodLabels[data.period]}</div>
                <div class="card">
                    <div class="stats-grid">
                        <div>
                            <div class="stat-label">Antal handler</div>
                            <div class="stat-value">${k.trade_count}</div>
                        </div>
                        <div>
                            <div class="stat-label">Win rate</div>
                            <div class="stat-value">${k.win_rate !== null ? k.win_rate + "%" : "—"}</div>
                        </div>
                        <div>
                            <div class="stat-label">Total P&L</div>
                            <div class="stat-value ${cls(k.total_pnl)}">${fmtMoneySigned(k.total_pnl)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Profit factor</div>
                            <div class="stat-value ${k.profit_factor !== null && k.profit_factor < 1 ? "negative" : "positive"}">${k.profit_factor !== null ? k.profit_factor : "—"}</div>
                        </div>
                        <div>
                            <div class="stat-label">Gns. vinder</div>
                            <div class="stat-value positive">${fmtMoneySigned(k.avg_win)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Gns. taber</div>
                            <div class="stat-value negative">${fmtMoneySigned(k.avg_loss)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Største gevinst</div>
                            <div class="stat-value positive">${fmtMoneySigned(k.biggest_win)}</div>
                        </div>
                        <div>
                            <div class="stat-label">Største tab</div>
                            <div class="stat-value negative">${fmtMoneySigned(k.biggest_loss)}</div>
                        </div>
                    </div>
                </div>

                <div class="section-title">P&L per dag</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead><tr>
                            <th>Dato</th>
                            <th style="text-align:right;">Handler</th>
                            <th style="text-align:right;">P&L</th>
                        </tr></thead>
                        <tbody>${dailyRows}</tbody>
                    </table>
                </div>

                <div class="section-title">Per ticker</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead><tr>
                            <th>Symbol</th>
                            <th style="text-align:right;">Handler</th>
                            <th style="text-align:right;">Vindere</th>
                            <th style="text-align:right;">Win rate</th>
                            <th style="text-align:right;">P&L</th>
                        </tr></thead>
                        <tbody>${tickerRows}</tbody>
                    </table>
                </div>

                <div class="section-title">Handler (seneste ${data.trades.length})</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead><tr>
                            <th>Tidspunkt</th>
                            <th>Symbol</th>
                            <th style="text-align:right;">Stk</th>
                            <th style="text-align:right;">Entry</th>
                            <th style="text-align:right;">Exit</th>
                            <th style="text-align:right;">P&L</th>
                        </tr></thead>
                        <tbody>${tradeRows}</tbody>
                    </table>
                </div>
            `;
        }

        function setPeriod(p) {
            analysisPeriod = p;
            loadAnalysis();
        }

        // ─────────────────────────────────────────────────────
        // Start — tjek auth først
        // ─────────────────────────────────────────────────────
        checkAuthAndStart();
    </script>
</body>

</html>
