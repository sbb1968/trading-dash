            logEntries = [];
            const liveTab = document.getElementById("log-tab-live");
            const histTab = document.getElementById("log-tab-hist");
            const histControls = document.getElementById("log-hist-controls");
            const connEl = document.getElementById("log-conn");

            if (mode === "live") {
                liveTab.className = "btn-primary";
                histTab.className = "btn-secondary";
                histControls.style.display = "none";
                histControls.style.display = "none";
                connEl.style.display = "inline";
                renderLogStream();
                connectLogStream();   // start live-stream
            } else {
                liveTab.className = "btn-secondary";
                histTab.className = "btn-primary";
                histControls.style.display = "flex";
                connEl.style.display = "none";
                stopLogStream();      // luk live-stream — vi viser historik nu
                document.getElementById("log-stream").innerHTML =
                    `<div class="empty">Vælg tidsvindue og klik Hent</div>`;
            }
        }

        function setOrbWindow() {
            document.getElementById("log-from").value = "09:30";
            document.getElementById("log-to").value   = "10:30";
            loadLogHistory();
        }

        function setFullDay() {
            document.getElementById("log-from").value = "08:00";
            document.getElementById("log-to").value   = "16:30";
            loadLogHistory();
        }

        async function loadLogHistory() {
            const date   = document.getElementById("log-date").value;
            const from   = document.getElementById("log-from").value;
            const to     = document.getElementById("log-to").value;
            const source = document.getElementById("log-source").value;
            const stream = document.getElementById("log-stream");

            stream.innerHTML = `<div class="empty">Henter events...</div>`;

            const params = new URLSearchParams();
            if (date) params.set("date", date);
            if (from) params.set("from_time", from);
            if (to)   params.set("to_time", to);
            if (source) params.set("source", source);

            try {
                const res = await fetch(`/journal/events?${params.toString()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                logEntries = (data.events || []).map(ev => {
                    // ts_local er ISO med tz — træk HH:MM:SS ud
                    const t = ev.ts_local ? ev.ts_local.substring(11, 19) : "";
                    const lvl = ev.payload?.level
                              || (ev.event_type === "strategy_stopped" ? "info" : "info");
                    const sym = ev.symbol ? ` ${ev.symbol}` : "";
                    const msg = ev.payload?.message
                              || `${ev.event_type}${sym}`;
                    return {
                        time: t,
                        text: `[${ev.source}] ${msg}`,
                        level: lvl,
                    };
                });
                if (logEntries.length === 0) {
                    stream.innerHTML = `<div class="empty">Ingen events i dette vindue</div>`;
                } else {
                    renderLogStream();
                }
            } catch (e) {
                stream.innerHTML = `<div class="error">Kunne ikke hente: ${e.message}</div>`;
            }
        }

        function connectLogStream() {
            stopLogStream();  // sikkerhed: luk evt. gammel

            // Byg ws:// (eller wss://) URL ud fra den side der serverede Studio,
            // så den altid peger på DENNE backends /ws/algo.
            const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${proto}//${window.location.host}/ws/algo`;

            try {
                logSocket = new WebSocket(wsUrl);
            } catch (e) {
                setLogConn(false, "Kunne ikke forbinde");
                scheduleLogReconnect();
                return;
            }

            logSocket.onopen = () => setLogConn(true, "Forbundet");

            logSocket.onmessage = (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch (e) { return; }
                handleLogMessage(msg);
            };

            logSocket.onclose = () => {
                setLogConn(false, "Afbrudt — genforbinder...");
                scheduleLogReconnect();
            };

            logSocket.onerror = () => {
                setLogConn(false, "Forbindelsesfejl");
                // onclose følger typisk efter og håndterer reconnect
            };
        }

        function scheduleLogReconnect() {
            // Genforbind kun hvis vi stadig er på Log-fanen OG i live-tilstand
            if (currentPage !== "log" || logMode !== "live") return;
            if (logReconnectTimer) return;
            logReconnectTimer = setTimeout(() => {
                logReconnectTimer = null;
                if (currentPage === "log") connectLogStream();
            }, 3000);
        }

        function setLogConn(online, text) {
            const el = document.getElementById("log-conn");
            if (!el) return;
            el.innerHTML = `<span class="status-dot ${online ? "online" : "offline"}"></span> ${text}`;
        }

        function handleLogMessage(msg) {
            const type = msg.type;
            let time, text, level = "info";

            if (type === "strategy_log") {
                time  = msg.timestamp || "";
                text  = `[${msg.strategy || "?"}] ${msg.message || ""}`;
                level = msg.level || "info";
            } else if (type === "algo_status") {
                time  = msg.time || "";
                const strat = msg.strategy ? `[${msg.strategy}] ` : "";
                text  = `${strat}${msg.message || ""}`;
                // Udled niveau fra status så fejl bliver røde
                level = msg.status === "error" ? "error"
                      : msg.status === "done"  ? "success"
                      : "info";
            } else if (type === "algo_trade") {
                time  = msg.time || "";
                const verb = { buy: "KØB", sell: "SÆLG", sell_short: "SHORT", buy_cover: "COVER" }[msg.action] || msg.action;
                const px   = msg.price != null ? `$${msg.price}` : (msg.exit_price != null ? `$${msg.exit_price}` : "");
                text  = `${verb} ${msg.shares || ""} ${msg.ticker || ""} ${px}`.trim();
                level = (msg.action === "buy" || msg.action === "sell_short") ? "trade" : "success";
            } else {
                return;  // ukendt type — ignorér
            }

            logEntries.push({ time, text, level });
            if (logEntries.length > LOG_MAX_ENTRIES) {
                logEntries = logEntries.slice(-LOG_MAX_ENTRIES);
            }
            renderLogStream();
        }

        function renderLogStream() {
            const container = document.getElementById("log-stream");
            if (!container) return;

            if (logEntries.length === 0) {
                container.innerHTML = `<div class="empty">Venter på beskeder...</div>`;
                return;
            }

            const colorFor = (level) => ({
                error:   "#ff8a8a",
                warning: "#fdba74",
                success: "#5ee99a",
                trade:   "#7ec0ff",
                info:    "#d0d0d0",
            }[level] || "#d0d0d0");

            // Tjek om brugeren er scrollet til bunden FØR vi tilføjer
            const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 40;

            container.innerHTML = logEntries.map(e => {
                const safeText = e.text
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:0; padding:0;" title="${safeText}">` +
                    `<span style="color:#666;">${e.time}</span> ` +
                    `<span style="color:${colorFor(e.level)};">${safeText}</span>` +
                    `</div>`;
            }).join("");

            // Auto-scroll til bunden hvis brugeren allerede var der
            if (atBottom) container.scrollTop = container.scrollHeight;
        }

        function clearLogView() {
            logEntries = [];
            renderLogStream();
        }

        // ─────────────────────────────────────────────────────
        // STATUS-SIDE — algoserverens helbred i ét blik
        // ─────────────────────────────────────────────────────
        let statusTimer = null;

        async function showStatus() {
            await loadStatusData();
            statusTimer = setInterval(() => {
                if (currentPage === "status") loadStatusData();
            }, 5000);
        }

        async function loadStatusData() {
            try {
                const res = await fetch("/status");
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                renderStatus(data);
            } catch (e) {
                document.getElementById("content").innerHTML = `
                    <div class="card"><div class="error"><strong>Fejl:</strong> ${e.message}</div></div>`;
            }
        }

        function renderStatus(d) {
            // Helper: grøn/rød indikator-prik med tekst
            const dot = (ok, okText, badText) =>
                `<span class="status-dot ${ok ? "online" : "offline"}"></span>${ok ? okText : badText}`;

            const id = d.identity || {};
            const sched = d.scheduler || {};
            const wd = d.tws_watchdog || {};
            const algo = d.algo || {};
            const risk = d.risk || {};
            const backend = d.backend || {};

            // TWS online = den PÅLIDELIGE kilde (watchdog prober aktivt port 7497).
            // ibkr.connected er en global variabel sat ved opstart — kan være stale.
            const twsOnline = wd.tws_online === true;
            const schedRunning = sched.running === true;
            const algoRunning = algo.running === true;

            // Jobs-tabel
            const jobsRows = (sched.jobs || []).map(j => `
                <tr>
                    <td>${j.name}</td>
                    <td class="num">${j.et_time} ET</td>
                    <td class="num">${j.last_run_on || "—"}</td>
                </tr>
            `).join("");

            const stats = algo.stats || {};

            document.getElementById("content").innerHTML = `
                <div class="section-title">Algoserver status
                    <span style="margin-left:12px; font-size:13px; font-weight:500; color:#888;">
                        ${d.time ? "opdateret " + new Date(d.time).toLocaleTimeString("da-DK") : ""}
                    </span>
                </div>

                <!-- KRITISKE INDIKATORER -->
                <div class="card">
                    <div class="stats-grid">
                        <div>
                            <div class="stat-label">TWS (port 7497)</div>
                            <div style="font-size:18px; font-weight:600; margin-top:6px;">
                                ${dot(twsOnline, "Online — Iben logget ind", "Offline — afventer login")}
                            </div>
                            ${!twsOnline && wd.fails ? `<div class="muted-text" style="margin-top:4px;">${wd.fails} mislykkede probes</div>` : ""}
                        </div>
                        <div>
                            <div class="stat-label">Scheduler</div>
                            <div style="font-size:18px; font-weight:600; margin-top:6px;">
                                ${dot(schedRunning, "Kører", "Stoppet")}
                            </div>
                            <div class="muted-text" style="margin-top:4px;">Næste ORB-start: ${sched.next_start || "—"}</div>
                        </div>
                        <div>
                            <div class="stat-label">Algoritme</div>
                            <div style="font-size:18px; font-weight:600; margin-top:6px;">
                                ${dot(algoRunning, "Kører", "Ikke aktiv (" + (stats.status || "idle") + ")")}
                            </div>
                            <div class="muted-text" style="margin-top:4px;">Handler i dag: ${stats.trades_today ?? 0}</div>
                        </div>
                    </div>
                </div>

                <!-- IDENTITET -->
                <div class="section-title">Identitet</div>
                <div class="card">
                    <div class="detail-grid">
                        <div class="detail-row"><div class="detail-label">Konto</div><div class="detail-value">${id.account || "—"}</div></div>
                        <div class="detail-row"><div class="detail-label">Instans</div><div class="detail-value">${id.instance || "—"}</div></div>
                        <div class="detail-row"><div class="detail-label">Rolle</div><div class="detail-value">${id.role || "—"}</div></div>
                        <div class="detail-row"><div class="detail-label">IBKR-konto</div><div class="detail-value">${id.ibkr || "—"}</div></div>
                        <div class="detail-row"><div class="detail-label">Type</div><div class="detail-value">${id.paper ? "Paper" : "LIVE"}</div></div>
                        <div class="detail-row"><div class="detail-label">ET-tid nu</div><div class="detail-value">${sched.now_et || "—"}</div></div>
                    </div>
                </div>

                <!-- SCHEDULER JOBS -->
                <div class="section-title">Planlagte jobs (${(sched.jobs || []).length})</div>
                <div class="card" style="padding:0;">
                    <table>
                        <thead><tr><th>Job</th><th style="text-align:right;">Tidspunkt</th><th style="text-align:right;">Sidst kørt</th></tr></thead>
                        <tbody>${jobsRows || `<tr><td colspan="3" class="empty">Ingen jobs</td></tr>`}</tbody>
                    </table>
                </div>

                <!-- RISK -->
                <div class="section-title">Risiko & kapital</div>
                <div class="card">
                    <div class="detail-grid">
                        <div class="detail-row"><div class="detail-label">Dagens P&L</div><div class="detail-value ${cls(risk.total_pnl_today)}">${fmtMoneySigned(risk.total_pnl_today)}</div></div>
                        <div class="detail-row"><div class="detail-label">Daglig tab-grænse</div><div class="detail-value">${fmtMoney(risk.daily_loss_limit)}</div></div>
                        <div class="detail-row"><div class="detail-label">Tab-grænse nået?</div><div class="detail-value">${risk.daily_limit_hit ? "JA ⚠" : "Nej"}</div></div>
                        <div class="detail-row"><div class="detail-label">Nødstop aktivt?</div><div class="detail-value">${risk.emergency_active ? "JA ⚠" : "Nej"}</div></div>
                        <div class="detail-row"><div class="detail-label">Eksponering</div><div class="detail-value">${fmtMoney(risk.total_exposure)} / ${fmtMoney(risk.max_total_exposure)}</div></div>
                        <div class="detail-row"><div class="detail-label">Backend journal-events</div><div class="detail-value">${backend.journal_events ?? "—"}</div></div>
                    </div>
                </div>

                <div class="controls">
                    <span>Auto-opdaterer hver 5s</span>
                    <button onclick="loadStatusData()">↻ Opdater nu</button>
                </div>
            `;
        }

        // ─────────────────────────────────────────────────────
        // Start — tjek auth først
        // ─────────────────────────────────────────────────────
        checkAuthAndStart();
    </script>
</body>

</html>
